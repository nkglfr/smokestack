name: release
# Push a tag to publish:  git tag v1.2.0 && git push origin v1.2.0
# Instances with automatic updates enabled pick the release up within hours.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Resolve dependencies
        run: test -f go.sum || go mod tidy
      - name: Build and sign packages
        env:
          SMOKESTACK_RELEASE_KEY: ${{ secrets.SMOKESTACK_RELEASE_KEY }}
        run: |
          test -n "$SMOKESTACK_RELEASE_KEY" || { echo "secret SMOKESTACK_RELEASE_KEY is missing"; exit 1; }
          make dist VERSION="${GITHUB_REF_NAME#v}" \
                    OFFICIAL_URL="${{ vars.OFFICIAL_URL || format('https://github.com/{0}', github.repository) }}" \
                    REPO_URL="https://github.com/${{ github.repository }}"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "smokestack ${GITHUB_REF_NAME#v}" --generate-notes
