name: release
# Two ways in, one path out.
#
#   git tag v1.2.0 && git push origin v1.2.0
#   or: Actions -> release -> Run workflow, with the version
#
# The second exists because an agent session cannot create a git ref, so it
# would otherwise have to hand every release back to a human at the last
# step — which is where today's mistake came from: a tag pushed before the
# work behind it was finished. A dispatched run creates the tag itself, and
# waits for whoever reviews the "release" environment before it does. Both
# ways then run exactly the same build, so nothing can drift between them.
#
# Instances with automatic updates enabled pick the release up within hours.
# Every job here compiles with the patch named in GOTOOLCHAIN below, not with
# whatever setup-go hands out. setup-go reads a manifest the runner image
# trails by days after a security release, and the point of naming it is that
# a standard library fix should reach what we build on the day it exists, not
# when the image catches up. The Go toolchain fetches a named patch itself,
# which is the mechanism the audit has always used (AUDIT_TOOLCHAIN in the
# Makefile); this makes the build and the audit agree on one version instead
# of judging a different binary from the one that ships.
env:
  GOTOOLCHAIN: go1.26.11

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, with or without the leading v (e.g. 0.6.1)"
        required: true
        type: string

# Read at the workflow level: only the job that tags and publishes needs to
# write, and the image job declares the package scope it needs itself. A
# workflow-wide write token is handed to every job in it, including the gate.
permissions:
  contents: read

jobs:
  # A gate, and nothing else. Required reviewers on the "release"
  # environment are what makes a dispatched release a request rather than an
  # act; a tag push skips this job, because pushing the tag was already the
  # human decision. It is a job of its own rather than an environment
  # expression on the job below, so that nothing depends on how an empty
  # environment name is treated.
  authorize:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      # Through the environment rather than interpolated: the value is typed
      # by whoever starts the run, and `run:` is a shell script.
      - env:
          VERSION: ${{ inputs.version }}
        run: echo "Publishing $VERSION, approved."

  release:
    needs: [authorize]
    # The gate is skipped on a tag push, and a skipped dependency would
    # otherwise skip this job too.
    if: always() && (needs.authorize.result == 'success' || needs.authorize.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # pushes the tag, creates the release
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # One name for the version, whichever door the run came through, so
      # every step below stops caring which it was.
      - name: Resolve the version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            V="${INPUT_VERSION#v}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          # Checked on both doors now, and against the shell before its own
          # shape. The shape pattern alone accepts "1.2.3; rm -rf /", because
          # * matches any string — and a git ref name may carry a semicolon,
          # so the tag door was not the safer one. This value reaches `make`
          # and `gh` below. The character class keeps "-rc1" working.
          case "$V" in
            *[!0-9A-Za-z.-]*)     echo "not a version: $V" >&2; exit 1 ;;
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)                    echo "not a version: $V" >&2; exit 1 ;;
          esac
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "publishing $V"

      # Refuse before building rather than after: a tag that already exists
      # means somebody has published this version, and overwriting it would
      # change what an instance already installed.
      - name: The version must not already be published
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists" >&2
            exit 1
          fi

      - name: Tag this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.v.outputs.tag }}
          V: ${{ steps.v.outputs.v }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $V"
          git push origin "$TAG"
      # The standard library is linked into what ships, so its patch level is
      # the release's. Without check-latest, "1.26" resolves to whatever the
      # runner image has cached, which trails a security release by days: on
      # the Monday after 1.26.9, the runners still handed out 1.26.8.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
      - name: Resolve dependencies
        run: test -f go.sum || go mod tidy
      - name: Build and sign packages
        env:
          SMOKESTACK_RELEASE_KEY: ${{ secrets.SMOKESTACK_RELEASE_KEY }}
          V: ${{ steps.v.outputs.v }}
          OFFICIAL_URL: ${{ vars.OFFICIAL_URL || format('https://github.com/{0}', github.repository) }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          test -n "$SMOKESTACK_RELEASE_KEY" || { echo "secret SMOKESTACK_RELEASE_KEY is missing"; exit 1; }
          make dist VERSION="$V" \
                    OFFICIAL_URL="$OFFICIAL_URL" \
                    REPO_URL="$REPO_URL"
      # A published version must be described in the changelog. Catching it
      # here is what keeps the two from drifting apart.
      # Blocking here, on purpose: this is the moment a missing section
      # becomes a release page describing the wrong thing. The section of the
      # version, or the Unreleased one, is required — not both, since a
      # version is often tagged while its entries still sit under Unreleased.
      - name: The changelog must describe this version
        env:
          V: ${{ steps.v.outputs.v }}
        run: |
          awk -v v="## $V" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            # Pending work is written under "## Unreleased" until a number is
            # chosen: use it, so the notes can never drift from the tag.
            awk '$0 == "## Unreleased" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
            if [ -s notes.md ]; then
              echo "Release notes taken from the Unreleased section."
            else
              echo "CHANGELOG.md has no '## $V' section and no '## Unreleased' section." >&2
              grep '^## ' CHANGELOG.md | head -3 >&2
              exit 1
            fi
          fi
          echo "Release notes taken from CHANGELOG.md:"; cat notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          V: ${{ steps.v.outputs.v }}
        run: |
          # A version with a hyphen (v0.2.0-rc1) is published as a
          # pre-release: GitHub leaves it out of "latest", so servers with
          # automatic updates never install it by themselves.
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          gh release create "$TAG" dist/* $PRE \
            --title "smokestack $V" --notes-file notes.md

  # The image is built by the shared workflow, so the same definition serves
  # the release and a by-hand rebuild. Tests and native packages do not
  # depend on it.
  #
  # The condition is not decoration: the gate above is skipped on a tag push
  # and GitHub carries that skip down the whole chain, so a job that merely
  # needs a job that succeeded is skipped anyway because an ancestor was not
  # run. That is what kept the 0.6.1 image from being published.
  image:
    needs: release
    if: always() && needs.release.result == 'success'
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
      packages: write
