name: release
# Push a tag to publish:  git tag v1.2.0 && git push origin v1.2.0
# Instances with automatic updates enabled pick the release up within hours.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Resolve dependencies
        run: test -f go.sum || go mod tidy
      - name: Build and sign packages
        env:
          SMOKESTACK_RELEASE_KEY: ${{ secrets.SMOKESTACK_RELEASE_KEY }}
        run: |
          test -n "$SMOKESTACK_RELEASE_KEY" || { echo "secret SMOKESTACK_RELEASE_KEY is missing"; exit 1; }
          make dist VERSION="${GITHUB_REF_NAME#v}" \
                    OFFICIAL_URL="${{ vars.OFFICIAL_URL || format('https://github.com/{0}', github.repository) }}" \
                    REPO_URL="https://github.com/${{ github.repository }}"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version with a hyphen (v0.2.0-rc1) is published as a
          # pre-release: GitHub leaves it out of "latest", so servers with
          # automatic updates never install it by themselves.
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* $PRE \
            --title "smokestack ${GITHUB_REF_NAME#v}" --generate-notes

  # Publishes the container image next to the release. Tests and native
  # packages do not depend on it.
  image:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
