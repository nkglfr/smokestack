name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The runner version is pinned rather than following ubuntu-latest: a
# release must not start building on a new distribution the day GitHub
# switches the label. The binaries are static (CGO_ENABLED=0), so the
# distribution does not leak into them, but the tooling around them does.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Resolve dependencies
        run: test -f go.sum || go mod tidy
      - name: Vet and test
        run: make test
      - name: Build and self-test
        run: |
          make build
          ./dist/smokestack selftest
      - name: Check front-end scripts
        run: |
          for f in web/*.js; do node --check "$f"; done
          for f in web/*.html; do
            python3 - "$f" <<'PY'
          import re, sys, subprocess, tempfile
          html = open(sys.argv[1]).read()
          for i, js in enumerate(re.findall(r"<script>(.*?)</script>", html, re.S)):
              with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False) as t:
                  t.write(js)
              subprocess.run(["node", "--check", t.name], check=True)
          PY
          done
      # The changelog and the published versions drifted twice: entries piled
      # up under one heading while three versions were already out.
      - name: Check the changelog against the tags
        run: |
          git fetch --tags --quiet || true
          sh scripts/changelog-check.sh

      - name: Check the installer
        run: sh -n install.sh

  # Builds the container image on every commit and runs its self-test, so a
  # broken Dockerfile is caught here and not by a user.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t smokestack:ci .
      - name: Self-test inside the container
        run: docker run --rm smokestack:ci selftest
