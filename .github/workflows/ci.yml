name: ci
# Everything that judges a commit, in one workflow: five jobs in parallel,
# one per surface, and a sixth that reports their verdict.
#
# One job per surface rather than one big one, because a CVE in a Go module
# and a shell quoting bug are not the same news, and reading which one is red
# should not mean opening a log. They are independent on purpose — only the
# verdict waits — so the slowest of them sets the wall-clock, not their sum.
#
# The schedule is the reason some of these exist at all. A vulnerability
# published the day after a merge is caught by nothing that only runs on a
# push, and this repository ships signed binaries that instances install by
# themselves within hours. The Monday run is the one that can say a released
# version became vulnerable without a line of it changing.
# Every job here compiles with the patch named in GOTOOLCHAIN below, not with
# whatever setup-go hands out. setup-go reads a manifest the runner image
# trails by days after a security release, and the point of naming it is that
# a standard library fix should reach what we build on the day it exists, not
# when the image catches up. The Go toolchain fetches a named patch itself,
# which is the mechanism the audit has always used (AUDIT_TOOLCHAIN in the
# Makefile); this makes the build and the audit agree on one version instead
# of judging a different binary from the one that ships.
env:
  GOTOOLCHAIN: go1.26.11

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  # The event is part of the group so that a push to main cannot cancel the
  # scheduled run that happens to be in flight: that run is the only one that
  # reports a vulnerability published since the last commit, and losing it
  # silently would cost a week.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The runner version is pinned rather than following ubuntu-latest: a
# release must not start building on a new distribution the day GitHub
# switches the label. The binaries are static (CGO_ENABLED=0), so the
# distribution does not leak into them, but the tooling around them does.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The same patch the release is built with — see release.yml.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
      - name: Resolve dependencies
        run: test -f go.sum || go mod tidy
      - name: Vet and test
        run: |
          set -o pipefail
          make test 2>&1 | tee /tmp/test.log || {
            grep -E "^(---|    ---| *[a-z_]+\.go:|FAIL|ok|# )" /tmp/test.log | tail -30 \
              | while IFS= read -r line; do echo "::error title=test::$line"; done
            exit 1
          }
      - name: Build and self-test
        run: |
          make build
          ./dist/smokestack selftest
      - name: Check front-end scripts
        run: |
          find web -name "*.js" -print0 | xargs -0 -n1 node --check
          for f in web/*.html; do
            python3 - "$f" <<'PY'
          import re, sys, subprocess, tempfile
          html = open(sys.argv[1]).read()
          for i, js in enumerate(re.findall(r"<script>(.*?)</script>", html, re.S)):
              with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False) as t:
                  t.write(js)
              subprocess.run(["node", "--check", t.name], check=True)
          PY
          done
      # The changelog and the published versions drifted twice: entries piled
      # up under one heading while three versions were already out.
      # A warning, not a failure: a documentation lag on main is not a broken
      # build, and a red main trains people to ignore red. The release
      # workflow refuses to publish a version without its section, which is
      # where the check actually protects something.
      - name: Check the changelog against the tags
        run: |
          git fetch --tags --quiet || true
          if ! sh scripts/changelog-check.sh; then
            echo "::warning title=Changelog drift::a published version has no section in CHANGELOG.md; see the log above"
          fi

  # gofmt, vet, staticcheck, govulncheck — all four through `make audit`, so
  # that what runs here is what a contributor can run before pushing. The
  # analyser versions and the toolchain they need are pinned in the Makefile.
  code:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Put the Go tool directory on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # The two analysers compile from source, which is most of this job's
      # time. Keyed on the Makefile, which is where their versions are pinned:
      # it moves more often than they do, and a miss costs a minute rather
      # than a wrong answer. No restore-keys — a partial hit would put the
      # previous version's binaries back, and this cache exists to serve an
      # exact one.
      - name: Cache the analysers
        id: tools
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: audit-tools-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - name: Install the analysers
        if: steps.tools.outputs.cache-hit != 'true'
        run: make audit-tools
      # The vulnerability database is fetched on every run, and that is the
      # point of this step: a cached verdict on last week's advisories is not
      # a verdict. Only the binaries are cached.
      - name: Audit the Go code
        run: make audit

  # install.sh is seventeen kilobytes of POSIX shell that runs as root on a
  # machine its author will never see. This replaces the `sh -n install.sh`
  # that used to sit in the test job: ShellCheck parses the script too, and
  # then reads it, where `sh -n` accepts every quoting bug there is.
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Pinned, rather than whatever apt carries. The runner's 0.9.0 and the
      # current 0.11.0 disagree about this very file: the older one raises
      # SC2015 on two `[ a ] && [ b ] || die` lines, where the idiom does
      # exactly what it reads as, and upstream has since stopped flagging it.
      # A check whose findings move with the runner image is a check that goes
      # red on a branch that changed nothing.
      - name: Audit the shell scripts
        run: |
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0 \
            -x -P SCRIPTDIR install.sh scripts/*.sh

  # The workflows are the most privileged thing in the repository: one of them
  # holds the release signing key and publishes binaries that instances
  # install without being asked. They are worth auditing as an attack surface
  # and not only as YAML.
  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Put the Go tool directory on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # Expression typos, shell syntax inside `run:`, inputs that do not
      # exist, action arguments that are ignored. It runs ShellCheck over
      # every `run:` block, which is how it caught an unquoted command
      # substitution in this very job.
      - name: Lint the workflows
        run: actionlint
      - name: Install zizmor
        run: pipx install zizmor==1.30.1
      # zizmor reads a workflow the way an attacker would: what a `run:` block
      # interpolates, what a token is allowed to do, what a cache can poison.
      # It is what pointed at the interpolated values and the workflow-wide
      # write token that release.yml used to carry.
      #
      # High severity and high confidence only. The rest is printed and not
      # blocked on purpose — persisted checkout credentials and a cache that
      # could in principle be poisoned are real, and they are not worth a red
      # build on a branch that touched neither. GITHUB_TOKEN is passed because
      # zizmor runs a reduced audit set offline, and the one it leaves out
      # includes the published advisories on the actions themselves.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity high --min-confidence high .github/workflows/

  # Built on every commit and self-tested, so a broken Dockerfile is caught
  # here and not by a user — and scanned in the same job, on the image that
  # was just built rather than on a second build of it.
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # First, because it needs no build: the Dockerfile itself, against the
      # container checks — a root user, a writable filesystem, a secret baked
      # into a layer.
      - name: Scan the Dockerfile
        run: |
          docker run --rm -v "$PWD:/scan" aquasec/trivy:0.75.0 config \
            --exit-code 1 /scan
      - name: Build the image
        run: docker build -t smokestack:ci .
      - name: Self-test inside the container
        run: docker run --rm smokestack:ci selftest
      # Through a saved tarball rather than the daemon: handing the Docker
      # socket to a container is handing it root on the runner, and a scanner
      # needs to read an image, not to drive a daemon.
      - name: Save the image
        run: docker save smokestack:ci -o image.tar
      # Two reasons to fail here, and the second is the one that matters.
      #
      # --exit-code 1 is the obvious one: a HIGH or CRITICAL in the base image
      # that a rebuild would fix. --ignore-unfixed, because a CVE with no
      # patch published is not something this repository can act on, and a
      # permanent red build teaches people to stop reading.
      #
      # --exit-on-eol 1 is the one this job was written for. The base was
      # alpine:3.20, which has stopped receiving security updates: the scan
      # reported zero vulnerabilities, and that zero only meant that nobody
      # publishes advisories for it any more. An unmaintained base is the one
      # case where a clean report is itself the symptom, so it has to fail on
      # its own terms rather than wait for a finding that can no longer come.
      #
      # Trivy is pinned, and its age costs little: the database is downloaded
      # on every run, so a pinned binary still reports this week's advisories.
      - name: Scan the image
        run: |
          docker run --rm -v "$PWD:/scan" aquasec/trivy:0.75.0 image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --exit-on-eol 1 --input /scan/image.tar

  # One box to tick in branch protection instead of five that have to be kept
  # in step with this file. Every job above is listed, so a job added without
  # being added here cannot quietly stop being required.
  #
  # `skipped` counts as a failure: nothing here is conditional, so a job is
  # skipped exactly when something it needed did not run, and a green tick on
  # that would be a lie.
  ci:
    name: ci
    needs: [test, code, shell, workflows, image]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every job must have passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          failed=$(printf '%s' "$RESULTS" | jq -r '[.[] | select(.result != "success")] | length')
          if [ "$failed" != 0 ]; then
            echo "$failed job(s) did not pass." >&2
            exit 1
          fi
          echo "All five passed."
