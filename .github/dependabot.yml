# Keeps Go modules and CI actions up to date: Dependabot opens a pull
# request each week, CI runs the tests on it, you merge and tag.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
