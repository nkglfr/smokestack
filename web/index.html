<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%232458e6%27/%3E%3Cstop offset=%271%27 stop-color=%27%230e8fa8%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M7 12h18M7 20h18%27 stroke=%27white%27 stroke-width=%272.5%27 stroke-linecap=%27round%27 opacity=%27.9%27/%3E%3C/svg%3E">
<title>smokestack</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/app.css">
<style>
:root{--grid:#eef2f7;--axis:#8e99aa}
:root[data-theme="dark"]{--grid:#1b2331;--axis:#6b778a}
.lbl{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}

/* bandeau d'état */
.hero{border-bottom:1px solid var(--line)}
.hero.ok{background:linear-gradient(180deg,var(--ok-soft),var(--bg))}
.hero.crit{background:linear-gradient(180deg,var(--crit-soft),var(--bg))}
.hero.warn{background:linear-gradient(180deg,var(--warn-soft),var(--bg))}
.hero-in{display:grid;gap:clamp(18px,3vw,40px);padding-block:clamp(22px,3.5vw,40px);grid-template-columns:1fr}
@media(min-width:1100px){.hero-in{grid-template-columns:minmax(0,1fr) auto;align-items:center}}
.hero .eyebrow{display:flex;align-items:center;gap:8px}
.hero.ok .eyebrow{color:var(--ok)}.hero.crit .eyebrow{color:var(--crit)}.hero.warn .eyebrow{color:var(--warn)}
.hero h1{font-size:clamp(24px,3.4vw,36px);line-height:1.12;letter-spacing:-.03em;margin:0 0 8px;font-weight:700}
.hero p.lead{margin:0;color:var(--ink-2);font-size:clamp(14px,1.3vw,16px)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:10px}
@media(max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .k{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.25}
.kpi .u{font-size:12px;color:var(--ink-3);font-weight:500;margin-left:3px}
.pulse{width:9px;height:9px;border-radius:50%;background:currentColor;animation:p 2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 50%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}

/* ossature */
.shell{display:grid;gap:clamp(18px,2.4vw,32px);padding:clamp(18px,2.4vw,28px) 0 20px;grid-template-columns:1fr}
@media(min-width:960px){.shell{grid-template-columns:250px minmax(0,1fr)}}
.rail{align-self:start;min-width:0}
@media(min-width:960px){.rail{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow-y:auto;padding-right:6px}}
.rail-tog{display:none;width:100%;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-soft);font-size:13.5px;font-weight:600}
.rail-tog .chev{margin-left:auto}
@media(max-width:959px){.rail-tog{display:flex}.rail #rail{display:none}.rail.open #rail{display:block;margin-top:10px}.rail.open .rail-tog .chev{transform:rotate(180deg)}}
.search{width:100%;font:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--bg-soft);color:var(--ink);margin-bottom:12px}
.rg{margin-bottom:3px}
.rgt{width:100%;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--radius-s);font-size:13px;font-weight:600;text-align:left}
.rgt:hover{background:var(--bg-soft)}
.chev{font-size:9px;color:var(--ink-3);width:9px;transition:transform .12s}
.rg[data-open="false"] .chev{transform:rotate(-90deg)}
.rg[data-open="false"] .rl{display:none}
.cbar{width:3px;height:15px;border-radius:var(--radius-xs);flex:none}
.rgn{margin-left:auto;font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.ri{width:100%;display:flex;align-items:center;gap:8px;padding:4px 8px 4px 28px;border-radius:var(--radius-s);font-size:12.8px;color:var(--ink-2);text-align:left}
.ri:hover{background:var(--bg-soft);color:var(--ink)}
.ri[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:550}
.ri .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri .vl{font-size:11px;color:var(--ink-3)}
.d-nodata{background:var(--ink-3)}
.netcard{display:block;margin-top:16px;border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;background:var(--bg-soft);color:inherit}
.netcard:hover{border-color:var(--accent);text-decoration:none}
.netcard .h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.netcard .n{font-weight:650;margin:3px 0 7px}
.netcard .s{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--ink-2)}
.netcard .s b{color:var(--ink);font-weight:650}

details.how{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-soft);margin-bottom:clamp(20px,2.6vw,30px)}
details.how summary{cursor:pointer;padding:11px 15px;font-size:13px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"?";width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:11px}
.how-b{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));padding:2px 15px 15px}
.how-b h3{margin:0 0 3px;font-size:12.5px}.how-b p{margin:0;font-size:12.5px;color:var(--ink-2)}

/* lignes */
.rows{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--bg)}
.row{display:grid;align-items:center;gap:14px;padding:11px 14px;cursor:pointer;border-top:1px solid var(--line-2);
  grid-template-columns:minmax(0,1.5fr) minmax(170px,1.4fr) 110px 86px 72px 100px}
.row:first-child{border-top:none}
.row:hover{background:var(--bg-soft)}
.row.a-crit{box-shadow:inset 3px 0 0 var(--crit)}.row.a-warn{box-shadow:inset 3px 0 0 var(--warn)}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who .nm{font-weight:550;font-size:13.8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .sb{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.since{font-size:11.5px;margin-top:2px}
.num{font-size:13.5px}.num b{font-weight:650}
.x{color:var(--warn);font-size:12px;margin-left:3px}
.hbar{display:flex;gap:1.5px;height:22px}
.hbar i{flex:1;border-radius:var(--radius-xs);background:var(--ok);opacity:.8}
.hbar i.w{background:var(--warn);opacity:1}.hbar i.c{background:var(--crit);opacity:1}.hbar i.n{background:var(--bg-sunk);opacity:1}
.hbar-l{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3);margin-top:2px}
canvas{display:block;width:100%}
@media(max-width:1180px){.row{grid-template-columns:minmax(0,1.3fr) minmax(140px,1fr) 86px 72px 96px}.row .spk{display:none}}
@media(max-width:720px){.row{grid-template-columns:minmax(0,1fr) 80px 90px}.row .hb,.row .lc{display:none}}
.catblock{margin-bottom:18px}
.cath{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.cath .t{font-size:14px;font-weight:650}
.empty{display:flex;gap:10px;align-items:center;padding:14px 16px;border-radius:var(--radius);background:var(--ok-soft);color:var(--ok);font-size:13.5px}

/* détail */
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);margin-bottom:12px}
.dh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dh h1{font-size:clamp(21px,2.6vw,28px);margin:0;letter-spacing:-.025em;font-weight:700}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{background:var(--bg-sunk);color:var(--ink-2);border-radius:var(--radius-s);padding:3px 9px;font-size:11.5px}
/* The twin target, in the other address family. An action rather than a
   label: it is the one tag you are meant to click, so it says so. */
.tag.twin{background:var(--accent-soft);color:var(--accent-ink);font-weight:650;
  text-decoration:none;display:inline-flex;align-items:center;gap:5px;
  border:1px solid color-mix(in srgb, var(--accent) 22%, transparent)}
.tag.twin:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.tag.twin svg{width:13px;height:13px;flex:none}
.presets{display:flex;gap:5px;margin-top:18px;flex-wrap:wrap;align-items:center}
.preset{padding:5px 12px;border-radius:var(--radius-s);border:1px solid var(--line);color:var(--ink-2);font-size:12.5px}
.preset[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:550}
#cw{position:relative}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-2);border-top:1px solid var(--line-2);margin-top:8px;padding-top:8px}
.sw{display:inline-block;vertical-align:middle;margin-right:5px}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-s);padding:7px 10px;font-size:11.5px;line-height:1.6;box-shadow:0 6px 20px rgba(0,0,0,.12);display:none;white-space:nowrap}
.stats{display:grid;gap:10px;margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.st{background:var(--bg-soft);border:1px solid var(--line-2);border-radius:var(--radius-s);padding:11px 13px}
.st .k{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.st .v{font-size:21px;font-weight:700;letter-spacing:-.02em}
.st .u{font-size:11.5px;color:var(--ink-3);font-weight:500;margin-left:3px}
.avrow{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.av{border:1px solid var(--line-2);border-left-width:3px;border-radius:var(--radius-s);padding:9px 12px;background:var(--bg-soft)}
.av-w{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.av-v{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.av-v .u{font-size:12px;color:var(--ink-3);font-weight:500;margin-left:2px}
.av-m{font-size:11px;color:var(--ink-3);line-height:1.5}
.av-ok{border-left-color:var(--ok)} .av-warn{border-left-color:var(--warn)}
.av-crit{border-left-color:var(--crit)} .av-n{border-left-color:var(--line)}
.corr{display:flex;gap:9px;align-items:center;flex-wrap:wrap;border:1px solid var(--line-2);
  border-left-width:3px;border-radius:var(--radius-s);padding:9px 12px;background:var(--bg-soft)}
.corr-m{font-size:12.5px;color:var(--ink-2)}
.corr-ok{border-left-color:var(--ok)} .corr-warn{border-left-color:var(--warn)}
.corr-crit{border-left-color:var(--crit)} .corr-n{border-left-color:var(--line)}
.trl{width:100%;border-collapse:collapse;font-size:13px}
.trl td,.trl th{padding:8px 10px;border-top:1px solid var(--line-2);text-align:left}
.trl th{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:550;border-top:none}
.trl tr.tr-row{cursor:pointer}.trl tr.tr-row:hover td{background:var(--bg-soft)}
.trl tr.diff td{background:var(--warn-soft)}
/* Le saut qui change de reseau se repere dans la colonne, sans avoir a lire
   la colonne AS ligne par ligne. */
.trl tr.ixhop td:first-child{box-shadow:inset 3px 0 var(--c-ix)}
.hopnote{color:var(--crit);font-weight:650;margin-left:6px}
</style>
</head>
<body>
<header class="hdr" id="hdr"></header>
<div id="view"><p class="wrap muted" style="padding:40px 0" data-i18n="common.loading">…</p></div>
<footer class="ftr" id="ftr"></footer>
<script src="/html.js"></script>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s), t = (k, v) => I18N.t(k, v);
const { html, raw, url } = H;
const PALETTE = ["#2458e6", "#0e8fa8", "#7a3fe0", "#0f917a", "#c26a00", "#c2185b", "#5d7a00", "#8d6e63"];
const PALETTE_DARK = ["#6b93ff", "#3cc3dc", "#a98bff", "#3fd1b4", "#f0a93a", "#f06292", "#aed581", "#bcaaa4"];
const dark = () => document.documentElement.dataset.theme === "dark";
const color = i => (dark() ? PALETTE_DARK : PALETTE)[i % PALETTE.length];
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const n1 = v => v == null ? "—" : I18N.num(v, 1);
const n2 = v => v == null ? "—" : I18N.num(v, v < 1 ? 2 : 1);
const avg = a => { const f = a.filter(x => x != null); return f.length ? f.reduce((x, y) => x + y, 0) / f.length : null; };
const clock = ts => new Intl.DateTimeFormat(I18N.lang, { hour: "2-digit", minute: "2-digit" }).format(new Date(ts * 1000));
function rgba(hex, a) { if (!hex.startsWith("#")) return hex; return `rgba(${parseInt(hex.substr(1, 2), 16)},${parseInt(hex.substr(3, 2), 16)},${parseInt(hex.substr(5, 2), 16)},${a})`; }

// A faulty target is also a critical one and belongs to a category: showing
// it three times on one page is noise. On by default, remembered locally.
// A shared link, /s/<token>: the page shows that one target and passes the
// token with every data request. It is a credential, so it never leaves in a
// referrer and the page is never indexed (the server says so too).
const SHARE = (location.pathname.match(/^\/s\/([A-Za-z0-9]+)\/?$/) || [])[1] || "";

const once = () => { try { return localStorage.getItem("smokestack.once") !== "0"; } catch (e) { return true; } };
const S = { ov: null, net: null, peers: 0, open: {}, q: "", view: "home", target: null,
            from: 0, to: 0, preset: 0, cur: null, nav: null, events: [], probes: [], probe: null };
const PRESETS = [["detail.preset_3h", 3 * 3600], ["detail.preset_30h", 30 * 3600], ["detail.preset_10d", 10 * 86400],
                 ["detail.preset_3m", 90 * 86400], ["detail.preset_1y", 365 * 86400]];

const cname = c => (I18N.lang === "fr" ? c.menu_fr : c.menu_en) || c.menu_en || c.menu_fr || c.slug;
const allTargets = () => S.ov ? S.ov.categories.flatMap((c, ci) => c.targets.map(x => Object.assign(x, { _cat: c, _ci: ci }))) : [];
const byId = id => allTargets().find(x => x.id === id);
const worst = list => list.some(x => x.status === "crit") ? "crit" : list.some(x => x.status === "warn") ? "warn" : "ok";

/* -------------------------------------------------------------- données */
async function loadOverview() {
  // "all=1" is only honoured for authenticated callers; visitors get the
  // public targets either way.
  S.ov = await App.getJSON(SHARE ? "/api/v1/overview?share=" + encodeURIComponent(SHARE)
    : "/api/v1/overview?all=1");
  S.ov.categories.forEach(c => { if (S.open[c.id] === undefined) S.open[c.id] = true; });
}
async function loadSide() {
  const [net, peers, probes] = await Promise.all([
    fetch("/api/v1/asn").then(r => r.ok ? r.json() : null).catch(() => null),
    fetch("/api/v1/fed/peers").then(r => r.ok ? r.json() : []).catch(() => []),
    fetch("/api/v1/probes").then(r => r.ok ? r.json() : null).catch(() => null)
  ]);
  S.net = net; S.peers = (peers || []).length;
  // A failed listing leaves the list empty, which hides the selector: the page
  // then behaves exactly as it did before there was a choice.
  S.probes = probes && Array.isArray(probes.probes) ? probes.probes : [];
}

// The vantage point is part of the view, like the time window. S.probe is null
// for the instance's default, which is also what the API assumes when the
// parameter is absent, so the default view keeps its old requests and old links.
const probeQ = () => S.probe ? "&probe=" + S.probe : "";
// Only a probe the instance actually lists is accepted. Anything else, and the
// instance's own probe, which is the default, collapse to null: a stale or
// hand-edited link falls back to the default view instead of an empty graph.
function pickProbe(id) { S.probe = id && S.probes.some(x => x.id === id && !x.local) ? id : null; }
function probeFromHash() { pickProbe(+new URLSearchParams(location.hash.slice(1)).get("probe")); }

/* ------------------------------------------------------------ gabarits */
function hbarHTML(tg) {
  return html`<div class="hbar" title="${t("home.last24h")}">${tg.hours.map(k =>
    html`<i class="${k === "crit" ? "c" : k === "warn" ? "w" : k === "nodata" ? "n" : ""}"></i>`)}</div>`;
}
function rowHTML(tg, showCat) {
  const k = tg.status;
  return html`<div class="row ${k === "crit" || k === "warn" ? "a-" + k : ""}" data-t="${tg.id}">
    <div><div class="who"><span class="dot d-${k}"></span><div style="min-width:0"><div class="nm">${tg.title}</div>
      <div class="sb"><span class="mono">${tg.host}</span>${
        showCat && html` · <span style="color:${color(tg._ci)}">${cname(tg._cat)}</span>`}${
        tg.public === false && html` · <span class="badge b-n">${t("status.private")}</span>`}</div></div></div>${
      tg.since && html`<div class="since" style="color:var(--${k === "crit" ? "crit" : "warn"})">${
        t("common.since")} ${clock(tg.since)} · ${I18N.ago(tg.since)}</div>`}</div>
    <div class="hb">${hbarHTML(tg)}</div>
    <div class="spk"><canvas height="30" data-spark="${tg.id}"></canvas></div>
    <div><div class="lbl">${t("metric.median")}</div><div class="num"><b>${n2(tg.med_ms)}</b> ms${
      tg.ratio && tg.ratio > 1.15 ? html`<span class="x">×${n1(tg.ratio)}</span>` : ""}</div></div>
    <div class="lc"><div class="lbl">${t("metric.loss")}</div><div class="num"><b>${n1(tg.loss_pct)}</b> %</div></div>
    <div style="text-align:right"><span class="badge b-${k === "nodata" ? "n" : k}">${t("status." + k)}</span></div></div>`;
}

function railGroup(c, ci, q) {
  const cm = q && cname(c).toLowerCase().includes(q);
  const list = c.targets.filter(x => !q || cm || x.title.toLowerCase().includes(q) || x.host.includes(q));
  if (!list.length) return "";
  return html`<div class="rg" data-open="${S.open[c.id] || !!q ? "true" : "false"}"><button class="rgt" data-tog="${c.id}"><span class="chev">▼</span>
      <span class="cbar" style="background:${color(ci)}"></span><span>${cname(c)}</span>
      <span class="rgn"><span class="dot d-${worst(list)}"></span>${list.length}</span></button><div class="rl">${
    list.map(x => html`<button class="ri" data-t="${x.id}" aria-current="${
      S.view === "detail" && S.target && S.target.id === x.id ? "true" : "false"}">
        <span class="dot d-${x.status}"></span><span class="nm">${x.title}</span><span class="vl mono">${n2(x.med_ms)}</span></button>`)
    }</div></div>`;
}

// The host-network figures are fetched from RIPEstat in the background:
// until the cache is warm the server answers {pending:true}, and a card
// full of "undefined" is worse than no card.
function netCard() {
  if (!S.net || S.net.pending || !S.net.asn) return "";
  const p = S.net.peeringdb, num = v => (v == null ? "—" : v);
  return html`<a class="netcard" href="/network"><div class="h">${t("home.hosted_by")}</div>
      <div class="n">AS${S.net.asn}${S.net.holder && " · " + S.net.holder.split(" - ")[0]}</div>
      <div class="s"><span><b>${num(S.net.prefixes_v4)}</b> IPv4 · <b>${num(S.net.prefixes_v6)}</b> IPv6</span>
      <span><b>${num(S.net.nb_upstreams)}</b> ${t("net.nb_up").toLowerCase()}</span>
      ${p && p.ixs && html`<span><b>${p.ixs.length}</b> IX</span><span>PeeringDB · ${p.policy || "—"}</span>`}</div>
      <div style="font-size:12px;color:var(--accent);margin-top:8px">${t("home.see_network")} →</div></a>`;
}

function railHTML() {
  const q = S.q.toLowerCase();
  return html`<input class="search" id="q" placeholder="⌕  ${t("metric.targets")}…" value="${S.q}">${
    S.ov.categories.map((c, ci) => railGroup(c, ci, q))}${netCard()}`;
}
function railBox() {
  const n = allTargets().length;
  return html`<aside class="rail" id="railBox"><button class="rail-tog" id="railTog"><span class="cbar" style="background:var(--accent)"></span>
    ${t("metric.categories")} · ${n} ${t("metric.targets").toLowerCase()}<span class="chev">▼</span></button>
    <div id="rail">${railHTML()}</div></aside>`;
}
// Un seul ecouteur : les « ? » sont reconstruits a chaque rendu, et deux

/* --------------------------------------------------------------- dessin */
const PAD = { l: 52, r: 12, t: 14, b: 34 };
function setup(cv, h) { const d = devicePixelRatio || 1, w = cv.parentElement.clientWidth || 600; cv.width = w * d; cv.height = h * d; cv.style.height = h + "px"; const c = cv.getContext("2d"); c.setTransform(d, 0, 0, d, 0, 0); return { c, w, h }; }
function draw(cv, s, o) {
  const { c, w, h } = setup(cv, o.height); c.clearRect(0, 0, w, h);
  const T = s.t || [];
  const pl = o.bare ? 1 : PAD.l, pr = o.bare ? 1 : PAD.r, pt = o.bare ? 3 : PAD.t, pb = o.bare ? 3 : PAD.b, lh = o.loss ? 22 : 0;
  const pw = w - pl - pr, ph = h - pt - pb - lh;
  let lo = 1e9, hi = -1e9;
  for (let i = 0; i < T.length; i++) { const a = (s.p05 || s.p25)[i], b = (s.p95 || s.p75)[i]; if (a != null) lo = Math.min(lo, a); if (b != null) hi = Math.max(hi, b); }
  const x0 = o.from != null ? o.from : T[0], x1 = o.to != null ? o.to : T[T.length - 1];
  const X = v => pl + (v - x0) / ((x1 - x0) || 1) * pw;
  if (lo > hi) { if (!o.bare) { c.fillStyle = cssv("--ink-3"); c.font = "12px system-ui,sans-serif"; c.textAlign = "center"; c.fillText(t("home.no_data"), w / 2, h / 2); } return { X, x0, x1, pw, ph, w, h, pl, Y: () => 0 }; }
  const mg = (hi - lo) * .12 || .05; lo = Math.max(0, lo - mg); hi += mg;
  const Y = v => pt + ph - (v - lo) / ((hi - lo) || 1) * ph, acc = o.accent, crit = cssv("--crit");
  if (!o.bare) {
    c.strokeStyle = cssv("--grid"); c.lineWidth = 1; c.fillStyle = cssv("--axis"); c.font = "10px system-ui,sans-serif"; c.textAlign = "right"; c.textBaseline = "middle";
    for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4, y = Math.round(Y(v)) + .5; c.beginPath(); c.moveTo(pl, y); c.lineTo(w - pr, y); c.stroke(); c.fillText(n2(v) + " ms", pl - 7, y); }
  }
  // Bandes, segment par segment : une valeur absente est un trou.
  const band = (a, b, f) => {
    let i = 0;
    while (i < T.length) {
      while (i < T.length && (a[i] == null || b[i] == null)) i++;
      const s0 = i; while (i < T.length && a[i] != null && b[i] != null) i++;
      if (i - s0 < 1) continue;
      c.beginPath();
      for (let k = s0; k < i; k++) k === s0 ? c.moveTo(X(T[k]), Y(a[k])) : c.lineTo(X(T[k]), Y(a[k]));
      for (let k = i - 1; k >= s0; k--) c.lineTo(X(T[k]), Y(b[k]));
      c.closePath(); c.fillStyle = f; c.fill();
    }
  };
  if (s.p95) band(s.p95, s.p05, rgba(acc, .15));
  band(s.p75, s.p25, rgba(acc, .3));
  c.lineWidth = o.bare ? 1.3 : 1.7; c.lineJoin = "round";
  const L = s.loss || [];
  for (let i = 1; i < T.length; i++) {
    if (s.med[i] == null || s.med[i - 1] == null) continue;
    c.beginPath(); c.moveTo(X(T[i - 1]), Y(s.med[i - 1])); c.lineTo(X(T[i]), Y(s.med[i]));
    c.strokeStyle = ((L[i] || 0) > 1 || (L[i - 1] || 0) > 1) ? crit : acc; c.stroke();
  }
  if (o.loss) {
    const base = h - pb + 4, bw = Math.max(1.5, pw / Math.max(T.length, 1) * .7);
    for (let i = 0; i < T.length; i++) { if (!(L[i] > .5)) continue; const bh = Math.min(lh, lh * L[i] / 40 + 3); c.fillStyle = rgba(crit.startsWith("#") ? crit : "#d92d20", Math.min(.95, .35 + L[i] / 50)); c.fillRect(X(T[i]) - bw / 2, base - bh, bw, bh); }
    c.strokeStyle = cssv("--line"); c.beginPath(); c.moveTo(pl, base + .5); c.lineTo(w - pr, base + .5); c.stroke();
  }
  if (!o.bare) {
    c.fillStyle = cssv("--axis"); c.textAlign = "center"; c.textBaseline = "top"; const span = x1 - x0;
    for (let i = 0; i <= 5; i++) {
      const ts = x0 + span * i / 5, d = new Date(ts * 1000);
      const lbl = span <= 2 * 86400 ? clock(ts) : new Intl.DateTimeFormat(I18N.lang, span <= 120 * 86400 ? { day: "2-digit", month: "short" } : { month: "short", year: "2-digit" }).format(d);
      c.fillText(lbl, Math.min(w - pr - 20, Math.max(pl + 20, X(ts))), h - 16);
    }
  }
  // Event labels: close events are stacked on successive rows so that
  // their labels never overlap.
  const rows = [];
  const evs = (o.events || []).filter(e => e.ts_start >= x0 && e.ts_start <= x1).sort((a, b) => a.ts_start - b.ts_start);
  // A dashed mark and a number, nothing more: the wording goes in the list
  // under the graph. A full sentence drawn here was unreadable, and an AS
  // path written across the plot told a visitor nothing.
  c.font = "10px system-ui,sans-serif";
  evs.forEach((e, i) => {
    const x = Math.round(X(e.ts_start)) + .5, am = cssv("--warn");
    c.save();
    c.setLineDash([3, 3]);
    c.strokeStyle = am; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x, pt); c.lineTo(x, h - pb); c.stroke();
    c.restore();
    const label = String(i + 1);
    const tw = c.measureText(label).width + 8;
    c.fillStyle = am;
    c.beginPath();
    if (c.roundRect) c.roundRect(x - tw / 2, pt - 13, tw, 12, 6); else c.rect(x - tw / 2, pt - 13, tw, 12);
    c.fill();
    c.fillStyle = "#fff"; c.textAlign = "center"; c.textBaseline = "top";
    c.fillText(label, x, pt - 12);
  });
  return { X, Y, x0, x1, pw, ph, w, h, pl };
}

// The numbered marks on the graph, spelled out: date, what happened, and the
// detail — the AS paths for a route change.
// The route as measured: one box per autonomous system crossed, from this
// network to the destination. Derived from the traceroutes, so it follows
// their visibility rules.
// A link that cannot curve straight into its box takes square corners: an
// orthogonal run with rounded angles through the given points, continuing a
// path that already stands on the first one.
function elbow(pts, r = 8) {
  let d = "";
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i - 1], [x, y] = pts[i], [nx, ny] = pts[i + 1];
    const a = Math.min(r, Math.hypot(x - px, y - py) / 2), b = Math.min(r, Math.hypot(nx - x, ny - y) / 2);
    d += ` L${x - Math.sign(x - px) * a},${y - Math.sign(y - py) * a}`;
    d += ` Q${x},${y} ${x + Math.sign(nx - x) * b},${y + Math.sign(ny - y) * b}`;
  }
  const [lx, ly] = pts[pts.length - 1];
  return d + ` L${lx},${ly}`;
}

// The map, drawn like a looking-glass bgpmap: one box per autonomous system,
// left to right from us to the target, arrows for the adjacencies actually
// observed. The current path is solid and runs straight along the top row,
// the ones seen earlier are dashed beneath it, so a target reached through two
// transits shows both. A path wider than the column it is drawn in folds onto
// the next row: scaling the whole map down to fit shrank the names until
// nothing on it could be read.
function asGraphSVG(g, avail) {
  // Le serveur numerote les couches par distance et peut en sauter une :
  // un chemin sans AS intermediaire donne 0, 2, 3. Indexer par ce numero
  // laissait un trou dans le tableau, et etaler un tableau a trous rend
  // undefined la ou il manque -- Math.max valait NaN, chaque boite
  // recevait translate(x, NaN) et le viewBox devenait invalide, si bien
  // que toutes se superposaient en haut a gauche. On ne garde que les
  // colonnes qui portent quelque chose.
  const byLayer = [];
  for (const n of g.nodes) (byLayer[n.layer] = byLayer[n.layer] || []).push(n);
  const layers = byLayer.filter(l => l && l.length);
  const BW = 150, BH = 44, GY = 18, TOP = 12, FOLD = 56;
  const ixW = ix => (ix.length > 16 ? 16 : ix.length) * 5.9 + 30;
  const shown = id => id[0] === "?" ? "?" : id; // a silent stretch is keyed by the network before it

  const colOf = {}, slot = {}, onPath = new Set();
  for (const e of g.edges || []) if (e.current) onPath.add(e.from).add(e.to);
  const cols = layers.map((l, c) => l.map(n => {
    colOf[n.asn] = c;
    slot[n.asn] = { n, c, cur: !!n.origin || onPath.has(n.asn), seen: n.seen, preds: [] };
    return slot[n.asn];
  }));
  // A link that skips columns takes a slot in each of them, as a box would:
  // drawn straight across, it ran under whatever box stood in the way and
  // its exchange was written on top of that box.
  const runs = (g.edges || []).filter(e => slot[e.from] && slot[e.to]).map(e => {
    const a = colOf[e.from], b = colOf[e.to], pts = [slot[e.from]];
    for (let c = a + 1; c < b; c++) {
      const s = { c, cur: !!e.current, seen: e.seen, preds: [], pass: true };
      cols[c].push(s);
      pts.push(s);
    }
    pts.push(slot[e.to]);
    if (b > a) for (let i = 1; i < pts.length; i++) pts[i].preds.push(pts[i - 1]);
    return { e, pts, back: b <= a };
  });

  // The current path first, so that it reads as one straight line; the
  // others beneath, each level with what it comes from.
  const colH = cols.map(col => {
    for (const s of col) s.at = s.preds.length ? s.preds.reduce((sum, p) => sum + p.dy, 0) / s.preds.length : Infinity;
    col.sort((p, q) => (q.cur - p.cur) || (p.at - q.at) || (q.seen - p.seen));
    let y = 0;
    col.forEach((s, row) => {
      const h = s.pass && row ? 8 : BH;
      s.dy = y + h / 2;
      y += h + GY;
    });
    return y - GY;
  });

  // A gutter opens to the widest exchange written in it: the badge sits on
  // its link, between two boxes, and must cover neither.
  const gw = layers.map(() => 54);
  for (const { e, back } of runs) if (e.ix && !back) gw[colOf[e.from]] = Math.max(gw[colOf[e.from]], ixW(e.ix) + 12);
  // A link running back stays on its row: folded, it would have to climb
  // through the boxes of the row below.
  const keep = [];
  for (const { e, back } of runs) if (back) for (let c = colOf[e.to]; c < colOf[e.from]; c++) keep[c] = true;
  const flat = layers.reduce((w, _, c) => w + BW + (c ? gw[c - 1] : 0), 0);
  const M = runs.some(r => r.back) || flat + 24 > avail ? 28 : 12; // room for a link going round to turn
  const bands = [];
  let used = 0;
  layers.forEach((_, c) => {
    const band = bands[bands.length - 1];
    if (band && (band.length < 2 || keep[c - 1] || used + gw[c - 1] + BW + 2 * M <= avail)) {
      band.push(c);
      used += gw[c - 1] + BW;
    } else {
      bands.push([c]);
      used = BW;
    }
  });
  const X = [], bandOf = [];
  bands.forEach((band, bi) => band.forEach((c, i) => {
    X[c] = i ? X[c - 1] + BW + gw[c - 1] : M;
    bandOf[c] = bi;
  }));
  const W = Math.max(...bands.map(b => X[b[b.length - 1]] + BW)) + M;
  const lane = []; // the free run under each row, where a link goes round
  let HT = TOP;
  for (const band of bands) {
    for (const c of band) for (const s of cols[c]) { s.x = X[c]; s.y = HT + s.dy; }
    HT += Math.max(...band.map(c => colH[c]));
    lane.push(HT + 18);
    HT += FOLD;
  }
  HT += TOP - FOLD;

  // A link folded onto the next row, or running back, goes round: down the
  // gutter after its box, along the lane under the row, up the gutter before
  // the box it enters -- never through one. Each takes its own track, so two
  // of them never draw a single line.
  let track = 0;
  const around = (p, q) => {
    const k = track++ % 4, ly = lane[bandOf[p.c]] + k * 6;
    const xo = bandOf[p.c + 1] === bandOf[p.c] ? X[p.c] + BW + gw[p.c] / 2 + k * 5 : W - 6 - k * 4;
    const xi = bandOf[q.c - 1] === bandOf[q.c] ? X[q.c] - gw[q.c - 1] / 2 - k * 5 : 6 + k * 4;
    HT = Math.max(HT, ly + 14);
    return { d: elbow([[p.x + BW, p.y], [xo, p.y], [xo, ly], [xi, ly], [xi, q.y], [q.x, q.y]]), at: [(xo + xi) / 2, ly] };
  };
  const badges = [];
  // The current path is drawn last, over the dashed ones it may share a run with.
  const edges = runs.sort((r, s) => !!r.e.current - !!s.e.current).map(({ e, pts, back }) => {
    const tip = `${shown(e.from)} → ${shown(e.to)} · ${e.seen}×` + (e.ix ? " · " + t("trace.ix_hint", { ix: e.ix }) : "");
    let d = `M${pts[0].x + BW},${pts[0].y}`, at;
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i - 1], q = pts[i];
      if (back || bandOf[p.c] !== bandOf[q.c]) {
        const r = around(p, q);
        d += r.d;
        at = at || r.at;
      } else {
        const mx = (p.x + BW + q.x) / 2;
        d += ` C${mx},${p.y} ${mx},${q.y} ${q.x},${q.y}`;
        at = at || [mx, (p.y + q.y) / 2];
      }
      if (q.pass) d += ` L${q.x + BW},${q.y}`;
    }
    if (e.ix) badges.push({ at, ix: e.ix, tip, cur: !!e.current });
    return html`<path d="${d}" fill="none" stroke="${e.current ? "var(--accent)" : "var(--ink-3)"}"
      stroke-width="${e.current ? 2 : 1.2}" stroke-dasharray="${e.current ? "none" : "4 4"}"
      opacity="${e.current ? 1 : .6}" marker-end="url(#${e.current ? "asarrow" : "asarrowo"})"
      ><title>${tip}</title></path>`;
  });
  // Two networks meet somewhere, and the exchange is the one thing a bare
  // arrow between them never says. It is written on the arrow, in the colour
  // it carries everywhere else: it is the hop an operator looks for first.
  // Two badges that would land on each other are stacked, the current
  // path's keeping its place.
  const placed = [];
  const labels = badges.sort((a, b) => b.cur - a.cur).map(({ at: [cx, y0], ix, tip }) => {
    const w = ixW(ix);
    let cy = y0;
    while (placed.some(([x, y, pw]) => Math.abs(x - cx) * 2 < w + pw && Math.abs(y - cy) < 18)) cy += 18;
    placed.push([cx, cy, w]);
    HT = Math.max(HT, cy + 12);
    const s = ix.length > 16 ? ix.slice(0, 15) + "…" : ix;
    return html`<g class="gixb"><rect x="${cx - w / 2}" y="${cy - 8}" width="${w}" height="16" rx="8"></rect>
      <text x="${cx}" y="${cy + 3.5}"><tspan class="gixk">IX</tspan><tspan dx="5">${s}</tspan></text>
      <title>${tip}</title></g>`;
  });
  const boxes = g.nodes.map(n => {
    const p = slot[n.asn];
    const cls = n.unknown ? "gnode gunknown" : n.origin ? "gnode gself" : n.dest ? "gnode gdest" : "gnode";
    const name = n.unknown ? t("detail.as_gap") : (n.name || "");
    return html`<g class="${cls}" transform="translate(${p.x},${p.y - BH / 2})">
      <rect width="${BW}" height="${BH}" rx="9"></rect>
      <text x="9" y="17" class="gasn">${n.unknown ? "?" : n.asn}</text>
      <text x="9" y="31" class="gname">${name.length > 22 ? name.slice(0, 21) + "…" : name}</text>
      ${n.rtt_ms ? html`<text x="${BW - 9}" y="17" class="grtt">${n2(n.rtt_ms) + " ms"}</text>` : ""}
      <title>${(n.unknown ? name : n.name || n.asn) + (n.seen ? " · " + n.seen + "/" + g.traces + " traceroutes" : "")}</title></g>`;
  });
  const marker = (id, fill) => html`<marker id="${id}" viewBox="0 0 8 8" refX="7" refY="4"
    markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${fill}"></path></marker>`;
  return html`<svg viewBox="0 0 ${W} ${HT}" class="asmap" style="width:100%;max-width:${W}px;height:auto">
    <defs>${marker("asarrow", "var(--accent)")}${marker("asarrowo", "var(--ink-3)")}</defs>
    ${edges}${boxes}${labels}</svg>`;
}

// Les explications servent une fois, pas a chaque visite : elles passent
// derriere un « ? » a cote du titre de la section, replie par defaut.
let HINT_N = 0;
const hint = key => {
  const text = t(key);
  if (!text) return "";
  const id = "hint" + (++HINT_N);
  return html`<span class="hint"><button type="button" class="hintb" aria-expanded="false"
    aria-controls="${id}" aria-label="${t("common.explain")}">?</button>
    <span class="hintbox" id="${id}" role="note" hidden>${text}</span></span>`;
};

async function renderASPath(tg) {
  const box = document.getElementById("asbox"), chain = document.getElementById("aschain");
  if (!box || !chain) return;
  let v = null;
  const pr = S.probe;
  try {
    v = await fetch(`/api/v1/aspath?target=${tg.id}` + probeQ() + (SHARE ? "&share=" + encodeURIComponent(SHARE) : ""))
      .then(r => r.ok ? r.json() : null);
  } catch (e) { /* the graph matters more than this */ }
  if (S.probe !== pr) return;
  if (!v || (!v.origin && !v.dest && !(v.path || []).length)) { box.hidden = true; return; }
  box.hidden = false;
  const node = (h, cls, sub) => html`<span class="asnode ${cls || ""}" title="${
    (h.name || h.asn) + (h.hops > 1 ? " · " + h.hops + " hops" : "")}">
    <span class="asn">${h.asn}</span>${h.name && html`<span class="asname">${h.name}</span>`}
    ${sub && html`<span class="asrole">${sub}</span>`}</span>`;
  // The arrow carries the exchange the path crossed to enter the network it
  // points at, when it crossed one.
  const arrow = via => html`<span class="asarrow" title="${via ? t("trace.ix_hint", { ix: via }) : ""}">${
    via && html`<span class="asvia">${via}</span>`}<span>→</span></span>`;
  const parts = [], vias = [];
  const push = (el, via) => { parts.push(el); vias.push(via || ""); };
  if (v.origin) push(node(v.origin, "self", t("detail.as_here")));
  for (const h of (v.path || [])) push(node(h, "", ""), h.via);
  // An unknown segment is said, not hidden: the ends do not touch.
  if (v.gap || v.empty) push(html`<span class="asnode unknown" title="${t("detail.as_gap_hint")}">
    <span class="asn">?</span><span class="asname">${t("detail.as_gap")}</span></span>`);
  if (v.dest) push(node(v.dest, "dest", ""), v.dest.via);
  else if (v.pending) push(html`<span class="asnode unknown"><span class="asn">…</span>
    <span class="asname">${t("common.loading")}</span></span>`);
  // One observed path: the chain reads better. Several: the map shows the
  // divergence, which the chain cannot.
  const g = v.graph;
  const branching = g && (g.edges || []).length > Math.max(0, (g.nodes || []).length - 1);
  // La carte est repliee a la largeur reelle de la colonne, mesuree ici.
  H.render(chain, branching ? asGraphSVG(g, Math.max(300, chain.clientWidth || 900))
    : parts.flatMap((n, i) => i ? [arrow(vias[i]), n] : [n]));
  // The global view, in its own block: it answers a different question.
  const rb = document.getElementById("risbox");
  if (rb) {
    const ris = v.ris;
    rb.hidden = !(ris && ris.prefix);
    if (!rb.hidden) {
      document.getElementById("risline").textContent = t("detail.ris_line",
        { prefix: ris.prefix, origin: ris.origin_asn || "?", peers: ris.peers || 0 });
      H.render(document.getElementById("risup"), (ris.upstreams || []).length
        ? html`<span class="faint" style="font-size:11.5px;margin-right:4px">${t("detail.ris_up")} :</span>${
            ris.upstreams.map(a => html`<span class="asnode ris"><span class="asn">${a}</span></span>`)}`
        : "");
    }
  }
  const meta = document.getElementById("asmeta");
  if (meta) {
    const bits = [];
    if (v.dest_ip) bits.push(v.dest_ip);
    if (v.ts) bits.push(new Date(v.ts * 1000).toLocaleString());
    if (branching) bits.push(t("detail.as_map_note", { n: g.traces }));
    // A name answering from several machines was traced to several places.
    // Saying which address this route belongs to is the whole point.
    if (g && g.other_addrs) bits.push(t("detail.as_one_addr", { n: g.other_addrs }));
    // Say why nothing sits between the two ends, rather than let the reader
    // conclude that these two networks are neighbours.
    if (v.empty) bits.push(t(v.empty === "no-trace"
      ? "detail.as_no_trace" : "detail.as_no_as"));
    meta.textContent = bits.join(" · ");
  }
}

function renderEvents() {
  const box = document.getElementById("evbox"), list = document.getElementById("evlist");

    .sort((a, b) => a.ts_start - b.ts_start);

  H.render(list, evs.map(e => html`<li>
      <span class="evdate">${new Date(e.ts_start * 1000).toLocaleString()}</span>
      <span class="evwhat">${e.kind === "path" ? t("detail.route_changed") : e.title}</span>
      ${e.body && html`<span class="evdetail mono">${e.body}</span>`}</li>`));
}

/* --------------------------------------------------------------- accueil */

function howBox(open) {

function renderHome() {

      <span style="margin-left:auto" class="badge b-${worst(cat.targets)}">${t("status." + worst(cat.targets))}</span></div>

        ? html`<div class="rows">${faults.map(x => rowHTML(x, true))}</div>`

    ${feat.length > 0 && html`<section class="section"><div class="section-h">

  requestAnimationFrame(() => document.querySelectorAll("[data-spark]").forEach(cv => {

/* ---------------------------------------------------------------- détail */
function openTarget(id, from, to) {
  const tg = byId(id); if (!tg) return;
  const now = Math.floor(Date.now() / 1000);
  S.view = "detail"; S.target = tg;
  if (from && to) { S.from = from; S.to = to; S.preset = -1; } else { S.preset = 0; S.to = now; S.from = now - PRESETS[0][1]; }
  S.nav = null; writeHash(true); renderDetail(); scrollTo({ top: 0 });
}
// Opening a target adds a history entry, so the browser's Back button
// returns to the overview; zooming only rewrites the current one.
function writeHash(push) {
  // A target has its own readable address, /t/<slug>: it is what search
  // engines index and what people paste. The time window stays in the hash.
  let path = "/", h = "";
  if (S.view === "detail" && S.target) {
    path = "/t/" + encodeURIComponent(S.target.slug || "");
    h = S.preset === -1 ? `#from=${S.from}&to=${S.to}` : `#p=${S.preset}`;
    if (!S.target.slug) { path = "/"; h = `#t=${S.target.id}` + (S.preset === -1 ? `&from=${S.from}&to=${S.to}` : `&p=${S.preset}`); }
  }
  if (S.view === "detail" && S.target && S.probe) h += "&probe=" + S.probe;
  const url = path + location.search + h;
  if (push && location.pathname + location.hash !== path + h) history.pushState(null, "", url);
  else history.replaceState(null, "", url);
}
// The pinned notice. A visitor is given the family and the network, never
// the address: the point is that the figures describe one machine, which does
// not require naming it to everyone who opens the page. When even the network
// is withheld — a target whose address is private — the sentence drops the
// parenthesis rather than showing an empty one.
function pinNote(tg) {
  if (!tg.pin_ip && !tg.pin_family) return "";
  return html`<div class="note-pin">${tg.pin_ip && tg.pin_family
    ? t("detail.pinned", { fam: "IPv" + tg.pin_family, ip: tg.pin_ip })
    : t("detail.pinned_plain")}</div>`;
}

// The maintenance banner. A reader who sees the measurement stop has to be
// able to understand it without writing to anybody, so the window says what
// it is, until when, and whether the measurement itself is paused — the
// difference matters: a paused measurement leaves a gap in the graph, a
// silenced alert does not.
function maintNote(tg) {
  const m = tg.maint;
  if (!m) return "";
  const key = m.stop_probe ? "maint.banner_probe" : "maint.banner_alerts";
  return html`<div class="note-maint"><strong>${t("maint.title")} — ${m.title}</strong>
    <span class="when">${t(key, { until: I18N.date(m.ends_at) })}</span>
    ${m.note && html`<span class="when">${m.note}</span>`}</div>`;
}

// On the home page, what is happening now and what is announced for the
// coming days, in one banner. Upcoming windows are worth showing: a reader
// who knows a stop is planned does not open a ticket when it happens.
async function renderMaintBanner() {
  const box = $("#mbanner");
  if (!box) return;
  let d = null;
  try {
    const r = await fetch("/api/v1/maintenance");
    if (r.ok) d = await r.json();
  } catch (e) { return; }
  const list = (d && d.maintenances) || [];
  if (!list.length) { box.hidden = true; return; }
  const now = d.now || Math.floor(Date.now() / 1000);
  const live = list.filter(m => m.starts_at <= now && m.ends_at > now);
  const soon = list.filter(m => m.starts_at > now);
  const line = m => html`<li><strong>${m.target_title || ""}</strong> — ${m.title}
    <span class="when">${t(m.starts_at > now ? "maint.from" : "maint.until",
      { from: I18N.date(m.starts_at), until: I18N.date(m.ends_at) })}${
      m.stop_probe && " · " + t("maint.measure_paused")}</span></li>`;
  box.hidden = false;
  H.render(box, html`<div class="note-maint">
    <strong>${live.length ? t("maint.live_title", { n: live.length }) : t("maint.soon_title", { n: soon.length })}</strong>
    <ul>${live.concat(soon).slice(0, 6).map(line)}</ul></div>`);
}

// Two arrows turning: the same service, measured in the other family.
const SWAP = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M3 10a7 7 0 0 1 11.9-5M21 14a7 7 0 0 1-11.9 5"/>
  <path d="M3 5v5h5M21 19v-5h-5"/></svg>`;

// One line per probe: its name, then where it is and which network it sits in
// when it says so. The instance's own probe is marked as the default.
function probeText(p) {
  const asn = p.asn ? (/^AS/i.test(p.asn) ? p.asn : "AS" + p.asn) : "";
  return [p.name, p.location, asn, p.local ? t("detail.probe_default") : ""].filter(Boolean).join(" · ");
}
// With a single probe there is nothing to choose, so nothing is drawn.
function probePicker() {
  if (S.probes.length < 2) return "";
  const hasLocal = S.probes.some(p => p.local);
  return html`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px">
    <label class="faint" for="probesel" style="font-size:12.5px">${t("detail.probe_from")}</label>
    <select id="probesel" style="font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-s);padding:5px 8px;max-width:100%">${
      !hasLocal && html`<option value="" ${S.probe ? "" : "selected"}>${t("detail.probe_default")}</option>`}${
      S.probes.map(p => html`<option value="${p.local ? "" : p.id}" ${(p.local ? !S.probe : S.probe === p.id) ? "selected" : ""}>${probeText(p)}</option>`)}</select></div>`;
}

function detailTags(tg) {
  return html`<div class="tags"><span class="tag mono">${tg.host}</span>
    <span class="tag">${tg.proto.toUpperCase()} · ${tg.interval_s} s</span>

    ${tg.twin_slug && html`<a class="tag twin" href="/t/${encodeURIComponent(tg.twin_slug)}"
      title="${t("detail.twin_hint")}">${raw(SWAP)}${t("detail.twin", { f: tg.family === 4 ? 6 : 4 })}</a>`}
    ${tg.public === false && html`<span class="tag" style="background:var(--warn-soft);color:var(--warn)">${t("status.private")}</span>`}
    ${tg.base_ms != null && html`<span class="tag">ref. ${n2(tg.base_ms)} ms</span>`}</div>`;
}

function chartCard(tg, acc) {

}

function renderDetail() {

    ${maintNote(tg)}

      <button class="preset" id="cp" style="margin-left:auto">\ud83d\udd17 ${t("common.copy_link")}</button></div>
    ${chartCard(tg, acc)}
    <div class="card" style="margin-top:10px"><div class="card-b" style="padding-block:10px">

      <div class="hbar-l"><span>−24 h</span><span>−12 h</span><span>${t("common.updated")}</span></div>
      <div class="lbl" style="margin:14px 0 3px">${t("detail.navigator")}${hint("detail.nav_hint")}</div><canvas id="nv" height="58"></canvas>
      </div></div>
    <div class="card" id="asbox" hidden style="margin-top:10px"><div class="card-b" style="padding-block:12px">

      <div class="aschain" id="aschain"></div>
      <div class="mono faint" id="asmeta" style="font-size:11px;margin-top:6px"></div>
      <div id="risbox" hidden style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">

        <div id="risline" style="font-size:12.5px"></div>
        <div class="aschain" id="risup" style="margin-top:7px"></div>
        </div></div></div>
    <div class="card" id="evbox" hidden style="margin-top:10px"><div class="card-b" style="padding-block:12px">
      <div class="lbl" style="margin-bottom:6px">${t("detail.events")}${hint("detail.ev_hint")}</div>
      <ol class="evlist" id="evlist"></ol>
      </div></div>
    <div class="stats" id="stats"></div>
    <div class="card" id="cobox" hidden style="margin-top:10px"><div class="card-b" style="padding-block:12px">
      <div class="lbl" style="margin-bottom:7px">${t("corr.title")}${hint("corr.hint")}</div>
      <div id="corr"></div>
      </div></div>
    <div class="card" id="avbox" hidden style="margin-top:10px"><div class="card-b" style="padding-block:12px">
      <div class="lbl" style="margin-bottom:7px">${t("avail.title")}${hint("avail.definition")}</div>
      <div class="avrow" id="avrow"></div>
      <p class="strip-hint" style="color:var(--warn)">${t("avail.not_sla")}</p></div></div>
    <section class="section" id="trsec" hidden style="margin-top:22px"><div class="section-h">
      <h2>${t("trace.title")}${hint("trace.sub")}</h2></div>

  bindRail();
  const ps = $("#probesel");
  // Changing the vantage point drops the cached year-long navigator, which was

  if (ps) ps.onchange = () => { pickProbe(+ps.value); S.nav = null; writeHash(); paint(); };
  $("#bk").onclick = e => { e.preventDefault(); S.view = "home"; writeHash(true); renderHome(); };
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { const now = Math.floor(Date.now() / 1000); S.preset = +b.dataset.p; S.to = now; S.from = now - PRESETS[S.preset][1]; writeHash(); paint(); });
  $("#cp").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(location.href); $("#cp").textContent = "✓"; };

}
async function paint() {
  const tg = S.target, acc = color(tg._ci), now = Math.floor(Date.now() / 1000);
  // The probe this paint was started for: a slower answer for a probe the visitor
  // has already left must not overwrite the one they are looking at.
  const pr = S.probe, pq = probeQ();
  const q = `/api/v1/series?target=${tg.id}&from=${S.from}&to=${S.to}&points=1500` + pq;
  const got = await Promise.all([
    App.getJSON(q + (SHARE ? "&share=" + encodeURIComponent(SHARE) : "")),
    fetch(`/api/v1/events?target=${tg.id}&from=${S.from}&to=${S.to}`).then(r => r.ok ? r.json() : []).catch(() => []),
    S.nav ? Promise.resolve(S.nav) : App.getJSON(`/api/v1/series?target=${tg.id}&from=${now - 365 * 86400}&to=${now}&points=600` + pq + (SHARE ? "&share=" + encodeURIComponent(SHARE) : "")),
    fetch(`/api/v1/traceroutes?target=${tg.id}&limit=40` + pq + (SHARE ? "&share=" + encodeURIComponent(SHARE) : "")).then(r => r.ok ? r.json() : []).catch(() => [])
  ]).catch(() => null);
  if (S.view !== "detail" || S.target !== tg || S.probe !== pr) return;
  if (!got) {
    $("#res").textContent = t("common.load_failed");
    setTimeout(() => { if (S.view === "detail" && S.target === tg && S.probe === pr) paint(); }, 10000);
    return;
  }
  const [cur, ev, nav, traces] = got;
  S.cur = cur; S.nav = nav; S.traces = traces || [];
  // Anomaly traceroutes are marked on the chart next to the annotated events.
  S.events = (ev || []).concat(S.traces.filter(x => x.kind === "anomaly").map(x => ({ ts_start: x.ts, title: "traceroute" })));
  renderTraces();
  $("#res").textContent = `${cur.resolution} · ${cur.step_s || tg.interval_s}s · ${cur.t.length} pts`;
  S.g = draw($("#ch"), cur, { height: 330, loss: 1, events: S.events, accent: acc, from: S.from, to: S.to });
  renderEvents();
  renderASPath(tg);
  S.ng = draw($("#nv"), nav, { height: 58, bare: 1, accent: acc, from: now - 365 * 86400, to: now }); sel();
  const jit = cur.p75.map((v, i) => v != null && cur.p25[i] != null ? v - cur.p25[i] : null);
  const st = (key, v, u) => html`<div class="st"><div class="k">${t(key)}</div><div class="v">${v}<span class="u">${u}</span></div></div>`;
  const loss = avg(cur.loss);
  // The fourth tile is the packet loss over the displayed window, named as
  // such. It used to read "uptime", which invited the reading that the
  // availability card below now answers properly: losing one packet in
  // five is not being unavailable one fifth of the time.
  H.render($("#stats"), [
    st("metric.median", n2(avg(cur.med)), "ms"),
    st("metric.p95", n2(avg(cur.p95)), "ms"),
    st("metric.jitter", n2(avg(jit)), "ms"),
    st("metric.loss", loss == null ? "—" : n1(loss), "%")
  ]);
  document.querySelectorAll("[data-p]").forEach(b => b.setAttribute("aria-pressed", String(S.preset === +b.dataset.p)));
  renderAvailability(tg);
  renderCorroboration(tg);
}

/* --------------------------------------------------------- corroboration */
// What a peer in another AS saw of this target, when the operator of this
// instance chose to publish it. One vantage point cannot tell a target that
// is down from a path that is broken; two in different networks can. The
// endpoint answers empty unless publishing is on, so there is nothing to
// hide here — an absent card means no corroboration was published.
async function renderCorroboration(tg) {
  const box = $("#cobox");
  if (!box) return;
  let d = null;
  try {
    const r = await fetch(`/api/v1/corroboration?target=${tg.id}` + (SHARE ? "&share=" + encodeURIComponent(SHARE) : ""));
    if (r.ok) d = await r.json();
  } catch (e) { d = null; }
  if (S.view !== "detail" || S.target !== tg) return;
  if (!d || !d.verdict || !d.peer_asn) { box.hidden = true; return; }
  const cls = { path: "crit", target: "crit", both_ok: "ok", intermittent: "warn", pending: "n" }[d.verdict] || "n";
  box.hidden = false;
  H.render($("#corr"), html`<div class="corr corr-${cls}">
    <span class="badge b-${cls}">${t("corr.v_" + d.verdict) || d.verdict}</span>
    <span class="corr-m">${t("corr.seen", { asn: d.peer_asn, ok: I18N.num(d.answered), n: I18N.num(d.passes) })}${
      d.med_ms && " · " + t("corr.median", { ms: n2(d.med_ms) })}</span></div>`);
}

/* ---------------------------------------------------------- availability */
// Availability counts measurement passes, not packets: the proportion of
// passes where the target answered at least once. A window with no
// measurement shows a dash, because unknown and zero are not the same
// thing, and a window that is not fully covered says so rather than
// letting a target created last week advertise a yearly figure.
async function renderAvailability(tg) {
  const box = $("#avbox"), row = $("#avrow");
  if (!box || !row) return;
  // Which vantage point this answer is about, kept so that a slow reply for a probe the reader has since
  // moved away from cannot land in the card as though it described the one they are looking at.
  const pr = S.probe;
  // The operator can stop publishing the figure. Asking for it anyway
  // would be answered with a 404, so the page does not ask.
  if (!App.site.public_availability) { box.hidden = true; return; }
  let d = null;
  try {
    // The availability figure follows the chosen vantage point, which the endpoint already supports. A
    // percentage from the default probe sitting beside a graph from another one would be read as describing
    // that graph, and a figure that is wrong while looking right is worse than no figure at all.
    const r = await fetch(`/api/v1/availability?target=${tg.id}` + probeQ() + (SHARE ? "&share=" + encodeURIComponent(SHARE) : ""));
    if (r.ok) d = await r.json();
  } catch (e) { d = null; }
  if (S.view !== "detail" || S.target !== tg || S.probe !== pr) return;
  const ws = (d && d.windows) || [];
  if (!ws.some(w => w.pct != null)) { box.hidden = true; return; }
  box.hidden = false;
  H.render(row, ws.map(w => {
    const known = w.pct != null;
    const cls = !known ? "n" : w.pct >= 99.9 ? "ok" : w.pct >= 99 ? "warn" : "crit";
    return html`<div class="av av-${cls}">
      <div class="av-w">${t("avail.window_" + w.label) || w.label}</div>
      <div class="av-v">${known ? n2(w.pct) : "—"}<span class="u">${known ? "%" : ""}</span></div>
      <div class="av-m">${known
        ? t("avail.passes", { n: I18N.num(w.passes), down: I18N.num(w.down) })
        : t("avail.unknown")}${w.partial && " · " + t("avail.partial")}</div></div>`;
  }));
}

/* ------------------------------------------------------------ traceroutes */
function hopRTT(h) {
  if (!h.rtt_ms || !h.rtt_ms.length) return "* * *";
  return n2(h.rtt_ms.reduce((a, b) => a + b, 0) / h.rtt_ms.length) + " ms";
}
function hopsHTML(tr, ref) {
  const n = Math.max(tr.hops.length, ref ? ref.hops.length : 0);
  const rows = [];
  for (let i = 0; i < n; i++) {
    const h = tr.hops[i], r = ref ? ref.hops[i] : null;
    const diff = ref && r && r.addr && (!h || (h.addr || "") !== r.addr);
    rows.push(html`<tr class="${(diff ? "diff" : "") + (h && h.ix ? " ixhop" : "")}"><td>${i + 1}</td>
      <td class="mono">${h && (h.addr || "*")}${h && h.note && html`<span class="hopnote">${h.note}</span>`}</td>
      <td class="faint">${h && (h.name || "")}</td>
      <td class="mono">${h && (h.asn || "")}${h && h.ix && html`<span class="ixb"
        title="${t("trace.ix_hint", { ix: h.ix })}">${h.ix}</span>`}</td>
      <td>${h ? hopRTT(h) : ""}</td><td class="faint">${h ? (h.rtt_ms || []).length + "/" + h.sent : ""}</td>
      ${ref && html`<td class="mono faint">${r ? r.addr || "*" : "—"}</td>`}</tr>`);
  }
  return html`<table class="trl"><thead><tr>
    <th>${t("trace.hop")}</th><th>${t("trace.address")}</th><th>${t("trace.name")}</th>
    <th>${t("trace.as")}</th><th>${t("trace.rtt")}</th><th>${t("trace.replies")}</th>
    ${ref && html`<th>${t("trace.ref_col")}, ${I18N.date(ref.ts)}</th>`}</tr></thead>
    <tbody>${rows}</tbody></table>
    ${ref && html`<p class="faint" style="font-size:12px;margin:8px 10px 0">${t("trace.changed")}</p>`}`;
}
function renderTraces() {
  const sec = $("#trsec"), box = $("#trbox"), list = S.traces || [];
  if (!sec) return;
  sec.hidden = !list.length; if (!list.length) return;
  if (S.trOpen === undefined || !list.some(x => x.id === S.trOpen)) {
    const first = list.find(x => x.kind !== "reference"); S.trOpen = first ? first.id : null;
  }
  const outcome = tr => {
    const last = tr.hops.length, lh = tr.hops[last - 1] || {};
    if (tr.reached) return html`<span class="badge b-ok">${t("trace.reached", { n: last })}</span>`;
    if (lh.note) return html`<span class="badge b-crit">${t("trace.refused", { n: last })} ${lh.note}</span>`;
    return html`<span class="badge b-warn">${t("trace.not_reached")}</span>`;
  };
  H.render(box, html`<table class="trl"><tbody>${list.map(tr => {
    const kind = { anomaly: "b-crit", reference: "b-ok", manual: "b-n" }[tr.kind] || "b-n";
    const ref = tr.kind === "reference" ? null : list.find(x => x.kind === "reference" && x.ts < tr.ts);
    return html`<tr class="tr-row" data-tr="${tr.id}">
        <td class="faint" style="white-space:nowrap">${I18N.date(tr.ts)}</td>
        <td><span class="badge ${kind}">${t("trace." + tr.kind)}</span></td><td>${tr.reason}</td>
        <td class="mono faint">${tr.dest}</td><td>${outcome(tr)}</td></tr>
      ${S.trOpen === tr.id && html`<tr><td colspan="5" style="background:var(--bg-soft);padding:6px 0 12px">${
        hopsHTML(tr, ref)}</td></tr>`}`;
  })}</tbody></table>`);
  box.querySelectorAll("[data-tr]").forEach(r => r.onclick = () => { const id = +r.dataset.tr; S.trOpen = S.trOpen === id ? null : id; renderTraces(); });
}

function sel() {
  const g = S.ng; if (!g) return; const c = $("#nv").getContext("2d"), a = g.X(Math.max(g.x0, S.from)), b = g.X(Math.min(g.x1, S.to)), ac = cssv("--accent");
  c.fillStyle = rgba(ac.startsWith("#") ? ac : "#2458e6", .14); c.fillRect(a, 2, Math.max(3, b - a), g.h - 4); c.strokeStyle = ac; c.strokeRect(Math.round(a) + .5, 2.5, Math.max(3, b - a), g.h - 5);
}
function bindChart() {
  const acc = color(S.target._ci);
  const redraw = () => {
    S.g = draw($("#ch"), S.cur, { height: 330, loss: 1, events: S.events, accent: acc, from: S.from, to: S.to });
    renderEvents();
  };
  const zoom = (cv, gg, rd) => {
    let d = 0, sx = 0, ex = 0; const px = e => e.clientX - cv.getBoundingClientRect().left;
    cv.onmousedown = e => { d = 1; sx = ex = px(e); };
    addEventListener("mouseup", () => {
      if (!d) return; d = 0; const g = gg(); if (!g) return;
      if (Math.abs(ex - sx) > 10) { const inv = p => g.x0 + (p - g.pl) / g.pw * (g.x1 - g.x0); const a = Math.round(inv(Math.min(sx, ex))), b = Math.round(inv(Math.max(sx, ex)));
        if (b - a > 120) { S.preset = -1; S.from = a; S.to = b; writeHash(); paint(); return; } }
      rd();
    });
    cv.addEventListener("mousemove", e => { if (!d) return; const g = gg(); ex = px(e); rd(); const c = cv.getContext("2d"); c.fillStyle = "rgba(36,88,230,.10)"; c.fillRect(Math.min(sx, ex), 4, Math.abs(ex - sx), g.ph || g.h); });
    cv.ondblclick = () => { const now = Math.floor(Date.now() / 1000); S.preset = 0; S.to = now; S.from = now - PRESETS[0][1]; writeHash(); paint(); };
  };
  zoom($("#ch"), () => S.g, redraw);
  zoom($("#nv"), () => S.ng, () => { const now = Math.floor(Date.now() / 1000); S.ng = draw($("#nv"), S.nav, { height: 58, bare: 1, accent: acc, from: now - 365 * 86400, to: now }); sel(); });
  const tip = $("#tip");
  $("#ch").addEventListener("mousemove", e => {
    const g = S.g, cur = S.cur; if (!g || !cur || !cur.t.length) return; const x = e.clientX - $("#ch").getBoundingClientRect().left;
    if (x < PAD.l || x > g.w - PAD.r) { tip.style.display = "none"; return; }
    const ts = g.x0 + (x - PAD.l) / g.pw * (g.x1 - g.x0); let i = 0, best = 1e18;
    for (let k = 0; k < cur.t.length; k++) { const dd = Math.abs(cur.t[k] - ts); if (dd < best) { best = dd; i = k; } }
    H.render(tip, html`<b>${I18N.date(cur.t[i])}</b><br>${t("metric.median")} ${n2(cur.med[i])} ms<br>p95 ${
      n2(cur.p95[i])} ms<br>${t("metric.loss")} ${n1(cur.loss[i])} %`);
    tip.style.display = "block"; tip.style.left = Math.min(g.w - 190, g.X(cur.t[i]) + 14) + "px"; tip.style.top = "20px";
  });
  $("#ch").addEventListener("mouseleave", () => { tip.style.display = "none"; });
}

/* ------------------------------------------------------------- démarrage */
function render() { S.view === "detail" && S.target ? renderDetail() : renderHome(); }
function bySlug(slug) {
  for (const c of (S.ov ? S.ov.categories : [])) for (const t of c.targets) if (t.slug === slug) return t;
  return null;
}
// openShared opens the single target a share link carries.
function openShared() {
  probeFromHash();
  const only = ((S.ov.categories || [])[0] || {}).targets || [];
  if (!only.length) return false;
  openTarget(only[0].id);
  return true;
}

function fromHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  probeFromHash();
  // /t/<slug>, then the older #t=<id> form so old links keep working.
  const m = location.pathname.match(/^\/t\/([^/]+)\/?$/);
  const tg = m ? bySlug(decodeURIComponent(m[1])) : null;
  const id = tg ? tg.id : +p.get("t");
  if (id && byId(id)) {
    if (p.get("from") && p.get("to")) openTarget(id, +p.get("from"), +p.get("to"));
    else { openTarget(id); const pi = +p.get("p"); if (pi > 0 && pi < PRESETS.length) { S.preset = pi; S.from = S.to - PRESETS[pi][1]; paint(); } }
    return true;
  }
  return false;
}
(async () => {
  let first = true, shown = false, failed = false, booted = false;
  // A shared link has one target and no overview to come back to: it opens
  // straight on that target.
  const show = () => {
    if (!S.ov) {
      H.render($("#view"), html`<p class="wrap muted" style="padding:40px 0">${t(failed ? "common.load_failed" : "common.loading")}</p>`);
      return;
    }
    shown = true;
    if (first) { first = false; if (SHARE ? openShared() : fromHash()) return; }
    if (SHARE) { openShared(); return; }
    render();
  };
  // The overview is the whole page. One failed request used to leave it
  // blank until a reload; it now says so and keeps trying.
  const loaded = (async () => {
    for (let wait = 5000; ; wait = Math.min(2 * wait, 60000)) {
      try { await Promise.all([loadOverview(), loadSide()]); return; } catch (e) { failed = true; if (booted) show(); }
      await new Promise(done => setTimeout(done, wait));
    }
  })();
  await App.boot("home", show);
  booted = true;
  await loaded;
  if (!shown) show();
  setInterval(async () => {
    try { await loadOverview(); } catch (e) { return; }
    if (S.view === "home") renderHome(); else if (S.target) { S.target = byId(S.target.id) || S.target; }
  }, 30000);
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 160); });
  const route = () => {
    if (SHARE) return openShared();
    if (!fromHash()) { S.view = "home"; S.target = null; renderHome(); }
  };
  addEventListener("hashchange", route);
  addEventListener("popstate", route);
})();
</script>
</body>
