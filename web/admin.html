<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%232458e6%27/%3E%3Cstop offset=%271%27 stop-color=%27%230e8fa8%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M7 12h18M7 20h18%27 stroke=%27white%27 stroke-width=%272.5%27 stroke-linecap=%27round%27 opacity=%27.9%27/%3E%3C/svg%3E">
<title>smokestack — administration</title>
<style>
  :root{--ink:#0f172a;--ink2:#64748b;--ink3:#94a3b8;--line:#e4e9f0;--line2:#f1f5f9;
        --panel:#f8fafc;--blue:#2563eb;--ok:#15803d;--warn:#b45309;--crit:#dc2626}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;width:100%;padding:7px 10px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;outline-offset:-1px;border-color:#93c5fd}
  label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
  .field{margin-bottom:11px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;
       font-size:13px;color:var(--ink)}
  .btn:hover{border-color:#93c5fd}
  .btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.p:hover{background:#1d4ed8}
  .btn.d{border-color:#fecaca;color:var(--crit)}
  .btn.d:hover{background:#fef2f2}
  .btn.s{padding:4px 10px;font-size:12px}
  .row2{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}

  /* entry screens */
  .gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--panel)}
  .gatebox{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);
           border-radius:14px;padding:26px}
  .gatebox h1{font-size:18px;margin:0 0 4px}
  .gatebox p.sub{font-size:13px;color:var(--ink2);margin:0 0 18px}
  .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#2563eb,#0891b2);
        display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;margin-bottom:14px}

  /* layout */
  .top{border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:10}
  .topin{display:flex;align-items:center;gap:14px;height:56px;padding:0 clamp(14px,2.5vw,28px)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600}
  .brand .logo{margin:0;width:22px;height:22px;font-size:11px}
  .spacer{flex:1}
  .who{font-size:12px;color:var(--ink2);text-align:right;line-height:1.3}
  .badge{border-radius:999px;padding:2px 9px;font-size:11px;font-weight:500}
  .terr{margin-top:4px;font-size:11.5px;color:var(--crit);max-width:520px;line-height:1.35}
  .twarn{margin-top:4px;font-size:11.5px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;
         border-radius:8px;padding:6px 8px;max-width:520px;line-height:1.4}
  .tpin{margin-top:4px;font-size:11.5px;color:var(--ink2)}
  .b-ok{background:#f0fdf4;color:var(--ok)}
  .b-warn{background:#fffbeb;color:var(--warn)}
  .b-crit{background:#fef2f2;color:var(--crit)}
  .b-n{background:var(--line2);color:var(--ink2)}

  .shell{display:grid;grid-template-columns:1fr;gap:0}
  @media(min-width:900px){.shell{grid-template-columns:212px minmax(0,1fr)}}
  nav.side{border-right:1px solid var(--line);padding:14px 10px;background:var(--panel)}
  @media(min-width:900px){nav.side{min-height:calc(100vh - 56px)}}
  .burger{display:none;font-size:16px;line-height:1;padding:6px 10px}
  .scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:30}
  @media(max-width:899px){
    .burger{display:inline-flex}
    nav.side{position:fixed;top:0;left:0;bottom:0;width:250px;z-index:40;overflow-y:auto;
      transform:translateX(-100%);transition:transform .18s ease;box-shadow:0 10px 40px rgba(15,23,42,.18)}
    nav.side.open{transform:none}
    .topin{gap:8px}
    .who{display:none}
    .body{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{min-width:max-content}
    table.resp{min-width:0;width:100%}
    table.resp thead{display:none}
    table.resp tr{display:block;border-top:1px solid var(--line2);padding:10px 0}
    table.resp td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0;text-align:right}
    table.resp td::before{content:attr(data-l);color:var(--ink3);font-size:11.5px;
      text-transform:uppercase;letter-spacing:.04em;text-align:left}
    table.resp td[data-l=""]::before{content:""}
    table.resp td.acts{flex-wrap:wrap;justify-content:flex-start;padding-top:8px}
    /* title, host and category stacked, not side by side */
    table.resp td.ttl{display:block;text-align:left;padding-bottom:6px}
  }
  nav.side button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    background:none;border:none;padding:8px 11px;border-radius:8px;font-size:13px;color:var(--ink2)}
  nav.side button:hover{background:#fff}
  nav.side button[aria-current="true"]{background:#eff6ff;color:#1d4ed8;font-weight:500}
  nav.side .grp{font-size:10px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink3);margin:14px 11px 5px}
  nav.side .n{margin-left:auto;background:var(--crit);color:#fff;border-radius:999px;
    font-size:10px;padding:1px 6px;font-weight:600}

  main{padding:clamp(16px,2.4vw,28px);min-width:0}
  h2{font-size:17px;font-weight:600;margin:0 0 3px;letter-spacing:-.01em}
  .lead{font-size:13px;color:var(--ink2);margin:0 0 20px}
  .card{border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
  .card h3{margin:0;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;
           font-weight:600;display:flex;align-items:center;gap:8px}
  .card .body{padding:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:500;color:var(--ink2);font-size:11px;text-transform:uppercase;
     letter-spacing:.03em;padding:6px 10px}
  td{padding:9px 10px;border-top:1px solid var(--line2);vertical-align:middle}
  tr.dis td{opacity:.55}
  .note{font-size:12px;color:var(--ink2);background:var(--panel);border-radius:8px;
        padding:10px 12px;margin-bottom:12px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:100;
    background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;
    box-shadow:0 6px 24px rgba(15,23,42,.25);display:none;max-width:90vw}
  .toast.err{background:var(--crit)}
  .fp{font-size:15px;letter-spacing:.06em;font-weight:600}
  .empty{font-size:13px;color:var(--ink3);padding:6px 0}
  .pend{border:1px solid #fed7aa;background:#fffbeb;border-radius:10px;padding:13px;margin-bottom:10px}
  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .quote{border-left:3px solid #fdba74;padding:6px 11px;margin:8px 0;font-size:13px;background:#fff}
  .quote.priv{border-left-color:#a5b4fc;background:#f5f7ff}
  .quote .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);display:block;margin-bottom:2px}
  .counter{font-size:11px;color:var(--ink3);text-align:right;margin-top:3px}
  .counter.bad{color:var(--crit)}
  .chk{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--ink);margin:10px 0}
  .chk input{width:auto;margin-top:3px}
  .chk small{display:block;color:var(--ink2);font-size:12px}
  .bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;min-width:90px}
  .bar i{display:block;height:100%;background:var(--ok)}
  .diff td{background:#fffbeb}
  .hopnote{color:var(--crit);font-weight:600;margin-left:6px}
  .trrow{cursor:pointer}
  .trrow:hover td{background:var(--panel)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font-size:12px;color:var(--ink2)}
  .tabs button[aria-pressed="true"]{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let CSRF="", ME=null, VIEW="dash", PENDING=0, UNREAD=0, LANGS=[], TR_TARGET=null;

function toast(msg,err){
  const t=$("#toast");t.textContent=msg;t.className="toast"+(err?" err":"");
  t.style.display="block";clearTimeout(t._t);
  t._t=setTimeout(()=>t.style.display="none",err?5200:2600);
}
async function api(method,path,body){
  const h={};
  if(body!==undefined){h["Content-Type"]="application/json";}
  if(CSRF) h["X-CSRF-Token"]=CSRF;
  const r=await fetch(path,{method,headers:h,
    body:body!==undefined?JSON.stringify(body):undefined,credentials:"same-origin"});
  if(r.status===204) return null;
  let data=null;
  try{ data=await r.json(); }catch(e){}
  if(!r.ok) throw new Error((data&&data.error)||("HTTP "+r.status));
  return data;
}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=ts=>ts?new Date(ts*1000).toLocaleString("en-GB",
  {day:"2-digit",month:"short",year:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
const gb=b=>(b/1073741824).toFixed(2)+" GB";
const ago=s=>s<60?s+" s ago":s<3600?Math.round(s/60)+" min ago":Math.round(s/3600)+" h ago";

/* --------------------------------------------------- entry screens */
function gateSetup(){
  $("#app").innerHTML=`<div class="gate"><div class="gatebox">
    <div class="logo">S</div>
    <h1>First-time setup</h1>
    <p class="sub">No account exists yet. Create the master account: it can manage
      users and the whole configuration.</p>
    <div class="field"><label>Setup code</label><input id="c" class="mono" placeholder="XXXX-XXXX-XXXX" autocomplete="off">
      <div style="font-size:11.5px;color:var(--ink2);margin-top:4px">Shown in the service log
        (<span class="mono">journalctl -u smokestack</span>) and in <span class="mono">/var/lib/smokestack/setup-code</span>.</div></div>
    <div class="field"><label>Email address</label><input id="e" type="email" autocomplete="username"></div>
    <div class="field"><label>Display name</label><input id="n" type="text"></div>
    <div class="field"><label>Password (12 characters minimum)</label>
      <input id="p" type="password" autocomplete="new-password"></div>
    <button class="btn p" id="go" style="width:100%">Create the master account</button>
  </div></div>`;
  const go=async()=>{
    try{
      const r=await api("POST","/api/v1/auth/setup",
        {setup_code:$("#c").value,email:$("#e").value,name:$("#n").value,password:$("#p").value});
      CSRF=r.csrf;ME=r.user;shell();
    }catch(e){toast(e.message,true);}
  };
  $("#go").onclick=go;
  $("#p").onkeydown=e=>{if(e.key==="Enter")go();};
}
function gateLogin(){
  $("#app").innerHTML=`<div class="gate"><div class="gatebox">
    <div class="logo">S</div>
    <h1>Administration</h1>
    <p class="sub">Sign in to access the back-office.</p>
    <div class="field"><label>Email address</label><input id="e" type="email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password"></div>
    <button class="btn p" id="go" style="width:100%">Sign in</button>
    <p class="sub" style="margin:16px 0 0;font-size:12px">
      <a href="/" style="color:var(--blue)">← Back to the public graphs</a></p>
  </div></div>`;
  const go=async()=>{
    try{
      const r=await api("POST","/api/v1/auth/login",{email:$("#e").value,password:$("#p").value});
      CSRF=r.csrf;ME=r.user;shell();
    }catch(e){toast(e.message,true);}
  };
  $("#go").onclick=go;
  $("#p").onkeydown=e=>{if(e.key==="Enter")go();};
}

/* ------------------------------------------------------------ layout */
const NAV=[
  {grp:"Monitoring"},
  {id:"dash",   label:"Dashboard", min:1},
  {id:"targets",label:"Targets and categories", min:2},
  {id:"traces", label:"Traceroutes", min:1},
  {id:"messages",label:"Messages", min:3, mbadge:true},
  {grp:"Federation"},
  {id:"fed",    label:"Peers and pairing", min:3, badge:true},
  {id:"notify", label:"NOC alerting (federation)", min:3},
  {id:"alerts", label:"My targets alerting", min:3},
  {id:"channels", label:"Notification channels", min:3},
  {grp:"Instance"},
  {id:"storage",label:"Storage", min:3},
  {id:"site",   label:"Publisher page", min:3},
  {id:"net",    label:"Host network", min:3},
  {id:"langs",  label:"Languages", min:3},
  {id:"update", label:"Updates", min:4},
  {grp:"Accounts"},
  {id:"users",  label:"Users", min:4},
  {id:"shares", label:"Share links", min:2},
  {id:"logs",   label:"Service log", min:3},
  {id:"audit",  label:"Audit log", min:3}
];
const LVL={viewer:1,editor:2,admin:3,master:4};

function shell(){
  let nav="";
  for(const n of NAV){
    if(n.grp){nav+=`<div class="grp">${n.grp}</div>`;continue;}
    if(LVL[ME.role]<n.min) continue;
    nav+=`<button data-v="${n.id}" aria-current="${VIEW===n.id}">${n.label}`+
      (n.badge&&PENDING?`<span class="n">${PENDING}</span>`:"")+
      (n.mbadge&&UNREAD?`<span class="n">${UNREAD}</span>`:"")+`</button>`;
  }
  $("#app").innerHTML=`
    <div class="top"><div class="topin">
      <button class="btn s burger" id="nav-burger" aria-label="Menu" aria-expanded="false">☰</button>
      <div class="brand" id="home" style="cursor:pointer" title="Dashboard"><span class="logo">S</span><span>smokestack</span>
        <span class="badge b-n" style="margin-left:6px">admin</span></div>
      <span class="spacer"></span>
      <div class="who"><div>${esc(ME.display_name)}</div>
        <div><span class="badge b-n">${ME.role}</span></div></div>
      <button class="btn s" id="pw">Password</button>
      <button class="btn s" id="out">Sign out</button>
    </div></div>
    <div class="shell"><nav class="side" id="side">${nav}</nav><main id="main"></main></div>
    <div class="scrim" id="scrim" hidden></div>`;
  $("#home").onclick=()=>{EDIT=null;go("dash");};
  $("#out").onclick=async()=>{await api("POST","/api/v1/auth/logout");location.reload();};
  $("#pw").onclick=changePassword;
  // The sidebar slides over the page on small screens and closes as soon
  // as a screen is chosen, so the content is never hidden behind it.
  const side=$("#side"), scrim=$("#scrim"), nb=$("#nav-burger");
  const closeNav=()=>{side.classList.remove("open");scrim.hidden=true;nb.setAttribute("aria-expanded","false");};
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{closeNav();VIEW=b.dataset.v;shell();});
  nb.onclick=e=>{e.stopPropagation();const open=!side.classList.contains("open");
    side.classList.toggle("open",open);scrim.hidden=!open;nb.setAttribute("aria-expanded",String(open));};
  scrim.onclick=closeNav;
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeNav();});
  addEventListener("resize",()=>{if(innerWidth>=900)closeNav();});
  render();
}
function go(view){VIEW=view;if(view!=="targets") EDIT=null;shell();}

async function changePassword(){
  const cur=prompt("Current password");if(!cur) return;
  const nw=prompt("New password (12 characters minimum)");if(!nw) return;
  try{
    await api("POST","/api/v1/auth/password",{current:cur,new:nw});
    toast("Password changed, please sign in again");
    setTimeout(()=>location.reload(),1200);
  }catch(e){toast(e.message,true);}
}

function render(){
  const m=$("#main");
  const views={dash:viewDash,targets:viewTargets,traces:viewTraces,messages:viewMessages,alerts:viewAlerts,channels:viewChannels,fed:viewFed,notify:viewNotify,
    storage:viewStorage,site:viewSite,net:viewNet,langs:viewLangs,update:viewUpdate,users:viewUsers,shares:viewShares,logs:viewLogs,audit:viewAudit};
  return (views[VIEW]||viewDash)(m);
}

/* --------------------------------------------------------- dashboard */
function probeCard(p){
  if(!p) return "";
  const age=p.last_seen_at?Math.round(Date.now()/1000-p.last_seen_at):null;
  const alive=age!=null&&age<120, W=p.writer;
  const mode={external:"isolated process",embedded:"embedded in the service",disabled:"disabled"}[p.mode]||p.mode;
  return `<div class="card"><h3>Measurement pipeline
    <span style="margin-left:auto">${p.mode==="disabled"?'<span class="badge b-n">disabled</span>'
      :alive?'<span class="badge b-ok">probe active</span>':'<span class="badge b-crit">probe silent</span>'}</span></h3><div class="body">
    <table><tbody>
      <tr><td style="width:240px">Probe mode</td><td>${esc(mode)}${p.mode==="embedded"
        ?' <span style="font-size:12px;color:var(--ink2)">— the isolated mode protects measurements better under heavy load</span>':""}</td></tr>
      <tr><td>Last measurement received</td><td>${age==null?"—":ago(age)}</td></tr>
      <tr><td>Measurements written / dropped</td><td>${W.written} / <span style="color:${W.dropped?"var(--crit)":"inherit"}">${W.dropped}</span></td></tr>
      <tr><td>Write queue</td><td>${W.queued} / ${W.capacity} · last batch ${W.last_batch_ms.toFixed(1)} ms</td></tr>
      <tr><td>Home page overview</td><td>built in ${p.overview_build_ms} ms, every 30 s</td></tr>
    </tbody></table></div></div>`;
}
// A container without the host network distorts every measurement: say so
// where the operator will see it.
async function containerBanner(){
  try{
    const c=await api("GET","/api/v1/admin/container");
    if(!c.in_container) return "";
    const bad=!c.host_network;
    return `<div class="note" style="margin:0 0 16px;border-left:3px solid ${bad?"var(--crit)":"var(--warn)"}">
      <strong>${bad?"Container without the host network":"Running in a container"}</strong><br>${esc(c.message)}.
      ${bad?`Until then, the numbers below include Docker's NAT and are not comparable with a native install.`:""}
      <a href="https://github.com/nkglfr/smokestack/blob/main/DEPLOY.md#12-container-image-tests" target="_blank" rel="noreferrer">Details</a></div>`;
  }catch(e){return "";}
}

async function viewDash(m){
  m.innerHTML=(await containerBanner())+`<h2>Dashboard</h2>
    <p class="lead">State of the instance, the probe and the storage.</p>
    <div id="d">Loading…</div>`;
  try{
    const [tree,st,peers,ps]=await Promise.all([
      api("GET","/api/v1/tree"),
      api("GET","/api/v1/admin/storage").catch(()=>null),
      api("GET","/api/v1/fed/peers").catch(()=>[]),
      api("GET","/api/v1/admin/probe/status").catch(()=>null)
    ]);
    const nT=(tree||[]).reduce((a,c)=>a+(c.targets||[]).length,0);
    const rep=st&&st.report?st.report:{};
    const stat=(k,v)=>`<div class="card"><div class="body"><div style="font-size:11px;color:var(--ink2)">${k}</div>
      <div style="font-size:22px;font-weight:600">${v}</div></div></div>`;
    $("#d").innerHTML=`
      <div class="row2">${stat("Categories",(tree||[]).length)}${stat("Targets",nT)}
        ${stat("Approved peers",(peers||[]).length)}${stat("Local archive",gb(rep.local_bytes||0))}</div>
      ${probeCard(ps)}
      <div class="card"><h3>Storage</h3><div class="body"><table><tbody>
        <tr><td style="width:240px">Mode</td><td><span class="badge b-n">${esc(rep.mode||"—")}</span></td></tr>
        <tr><td>Disk usage</td><td>${((rep.disk_used_pct||0)*100).toFixed(1)} %
          ${rep.degraded?'<span class="badge b-crit">degraded mode</span>':""}</td></tr>
        <tr><td>Local chunks</td><td>${rep.chunks||0}</td></tr>
        <tr><td>Pending uploads</td><td>${rep.pending_uploads||0}</td></tr>
        <tr><td>Projected retention</td><td>${rep.projected_days?rep.projected_days.toFixed(0)+" days at the current rate":"—"}</td></tr>
      </tbody></table></div></div>`;
  }catch(e){$("#d").innerHTML=`<div class="note">${esc(e.message)}</div>`;}
}

/* ----------------------------------------------------------- targets */
const FAMILY={0:"auto",4:"IPv4",6:"IPv6"};
const COMMON_PORTS=[[443,"HTTPS"],[80,"HTTP"],[22,"SSH"],[53,"DNS"],[25,"SMTP"],[587,"SMTP submission"],[179,"BGP"],[3306,"MySQL"],[5432,"PostgreSQL"],[8080,"HTTP alt"]];
let EDIT=null;   // target being edited, null when creating

async function viewTargets(m){
  const editing=!!EDIT;
  m.innerHTML=`<h2>Targets and categories</h2>
    <p class="lead">A burst must fit in its interval: packets × spacing + timeout must stay
      below 75 % of the interval. At 30 s, use 10 packets spaced by 200 ms.

        b.closest("tr").parentNode.insertBefore(box,b.closest("tr").nextSibling);

      }catch(e){toast(e.message,true);}

    document.querySelectorAll("[data-advice]").forEach(b=>b.onclick=async()=>{
      const id=b.dataset.advice, host=b.closest("tr");
      b.disabled=true;
      try{
        const a=await api("GET","/api/v1/admin/targets/"+id+"/advice");
        const VERD={clean:"b-ok","rate limiting":"b-warn","real outages":"b-crit",
                    "scattered loss":"b-warn","not enough data":"b-n"};
        const box=document.createElement("tr");
        box.innerHTML=`<td colspan="8"><div class="note" style="margin:0">
          <span class="badge ${VERD[a.verdict]||"b-n"}">${esc(a.verdict)}</span>
          ${a.loss_pct?` <strong>${a.loss_pct.toFixed(2)} %</strong> loss over 24 h`:""}
          <div style="margin-top:6px">${esc(a.detail)}</div>
          ${(a.suggestions||[]).map((s,i)=>`<div style="margin-top:8px">
            <strong>${esc(s.label)}</strong> — ${esc(s.why)}
            <button class="btn p s" data-apply="${id}" data-patch="${esc(JSON.stringify(s.patch))}"

        host.parentNode.insertBefore(box,host.nextSibling);

          try{await api("PATCH","/api/v1/admin/targets/"+ab.dataset.apply,JSON.parse(ab.dataset.patch));
            toast("Target settings updated");render();}catch(e){toast(e.message,true);}

      }catch(e){toast(e.message,true);}
      b.disabled=false;

    document.querySelectorAll("[data-now]").forEach(b=>b.onclick=async()=>{
      try{await api("POST","/api/v1/admin/targets/"+b.dataset.now+"/check");

    document.querySelectorAll("[data-trace]").forEach(b=>b.onclick=()=>{TR_TARGET=+b.dataset.trace;go("traces");});
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Delete this target? It is archived: the measurements are kept, the name becomes free again.")) return;
      try{await api("DELETE","/api/v1/admin/targets/"+b.dataset.del);
        toast("Target deleted");render();}catch(e){toast(e.message,true);}
    });
  }catch(e){$("#tlist").innerHTML=`<div class="note">${esc(e.message)}</div>`;}
}

/* ------------------------------------------------------- traceroutes */
const KIND_BADGE={anomaly:"b-crit",reference:"b-ok",manual:"b-n"};
function hopRTT(h){
  if(!h.rtt_ms||!h.rtt_ms.length) return "* * *";
  const v=h.rtt_ms,avg=v.reduce((a,b)=>a+b,0)/v.length;
  return `${avg.toFixed(2)} ms <span style="color:var(--ink3)">(${Math.min(...v).toFixed(2)}–${Math.max(...v).toFixed(2)})</span>`;
}
function hopsTable(tr,ref){
  const rows=[],n=Math.max(tr.hops.length,ref?ref.hops.length:0);
  for(let i=0;i<n;i++){
    const h=tr.hops[i],r=ref?ref.hops[i]:null;
    const differs=ref&&r&&r.addr&&(!h||(h.addr||"")!==r.addr);
    rows.push(`<tr class="${differs?"diff":""}"><td>${i+1}</td>
      <td class="mono">${h?esc(h.addr||"*"):""}${h&&h.note?`<span class="hopnote" title="the router refused to forward">${esc(h.note)}</span>`:""}</td>
      <td style="font-size:12px">${h?esc(h.name||""):""}</td>
      <td class="mono" style="font-size:12px">${h?esc(h.asn||""):""}</td>
      <td style="font-size:12px">${h?hopRTT(h):""}</td>
      <td style="font-size:12px">${h?`${(h.rtt_ms||[]).length}/${h.sent}`:""}</td>
      ${ref?`<td class="mono" style="font-size:12px;color:var(--ink2)">${r?esc(r.addr||"*"):"—"}</td>`:""}</tr>`);
  }
  return `<table style="margin-top:6px"><thead><tr><th>Hop</th><th>Address</th><th>Name</th><th>AS</th>
    <th>RTT (avg, min–max)</th><th>Replies</th>${ref?`<th>Reference path, ${dt(ref.ts)}</th>`:""}</tr></thead>
    <tbody>${rows.join("")}</tbody></table>
    ${ref?`<div style="font-size:12px;color:var(--ink2);margin-top:6px">Highlighted rows: a router of the last healthy path is different or no longer answers.</div>`:""}`;
}
// One point per traceroute: a jump in the number of hops, or a path that
// stops reaching the destination, is a topology change you can see.
function hopChart(pts){
  if(!pts||pts.length<2) return `<div class="empty">Not enough traceroutes yet.</div>`;
  const W=760,H=120,P=24;
  const max=Math.max(...pts.map(p=>p.hops),1), min=Math.min(...pts.map(p=>p.hops),max);
  const lo=Math.max(0,min-1), hi=max+1;
  const x=i=>P+i*(W-2*P)/Math.max(1,pts.length-1);
  const y=v=>H-P-(v-lo)*(H-2*P)/Math.max(1,hi-lo);
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.hops).toFixed(1)}`).join("");
  const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.hops).toFixed(1)}" r="${p.kind==="reference"?2.5:3.5}"
     fill="${p.reached?(p.kind==="anomaly"?"#dc2626":"#0ea5e9"):"#f59e0b"}">
     <title>${esc(new Date(p.ts*1000).toLocaleString())} — ${p.hops} hops, ${esc(p.kind)}${p.reached?"":", not reached"}${p.as_path?" — "+esc(p.as_path):""}</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px">
    <path d="${line}" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>${dots}
    <text x="4" y="${y(hi).toFixed(1)}" font-size="10" fill="#94a3b8">${hi}</text>
    <text x="4" y="${y(lo).toFixed(1)}" font-size="10" fill="#94a3b8">${lo}</text>
  </svg>
  <div style="font-size:11.5px;color:var(--ink2);margin-top:4px">${pts.length} traceroutes over 30 days ·
    blue: destination reached · amber: not reached · red: taken during an anomaly ·
    hover a point for its AS path</div>`;
}

async function viewTraces(m){
  m.innerHTML=`<h2>Traceroutes</h2>
    <p class="lead">The probe runs a traceroute by itself when a target leaves its baseline
      (packet loss above 3 %, or median above 1.4 × its usual value), at most once every
      15 minutes per target and 30 times per hour overall. It also records a reference path
      once a day while the target is healthy, so an anomaly can be compared with a known-good
      path. Traceroutes are shown on public pages only if enabled in <a href="#" id="tosite">Publisher page</a>.</p>
    <div class="card"><div class="body">
      <div class="row2" style="align-items:end">
        <div class="field" style="margin:0"><label>Target</label><select id="trt"></select></div>
        <div style="display:flex;gap:7px"><button class="btn p" id="trrun">Run a traceroute now</button>
          <button class="btn" id="trref">Refresh</button></div>
      </div></div></div>
    <div class="card"><h3>Hops over time</h3><div class="body" id="hopg">Loading…</div></div>
    <div class="tabs" id="trtabs"></div>
    <div class="card"><div class="body" id="trl">Loading…</div></div>`;
  $("#tosite").onclick=e=>{e.preventDefault();go("site");};
  const targets=await api("GET","/api/v1/admin/targets").catch(()=>[]);
  if(!targets||!targets.length){$("#trl").innerHTML=`<div class="empty">No target yet.</div>`;return;}
  if(!TR_TARGET||!targets.some(t=>t.id===TR_TARGET)) TR_TARGET=targets[0].id;
  $("#trt").innerHTML=targets.map(t=>`<option value="${t.id}" ${t.id===TR_TARGET?"selected":""}>${esc(t.title)} — ${esc(t.host)}</option>`).join("");
  let kind="", list=[], open=null;
  // Reloaded on every target change: the chart described the first target
  // whatever was selected.
  const loadHops=()=>{
    if($("#hopg")) $("#hopg").innerHTML="Loading…";
    api("GET","/api/v1/admin/hops?target="+TR_TARGET+"&days=30")
      .then(p=>{ if($("#hopg")) $("#hopg").innerHTML=hopChart(p); })
      .catch(e=>{ if($("#hopg")) $("#hopg").innerHTML=`<div class="note">${esc(e.message)}</div>`; });
  };
  const draw=()=>{
    $("#trtabs").innerHTML=[["","All"],["anomaly","Anomalies"],["reference","References"],["manual","Manual"]]
      .map(([k,l])=>`<button data-k="${k}" aria-pressed="${kind===k}">${l} (${k?list.filter(x=>x.kind===k).length:list.length})</button>`).join("");
    document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{kind=b.dataset.k;draw();});
    const shown=kind?list.filter(x=>x.kind===kind):list;
    if(!shown.length){$("#trl").innerHTML=`<div class="empty">No traceroute yet for this target.</div>`;return;}
    $("#trl").innerHTML=`<table><thead><tr><th>When</th><th>Kind</th><th>Reason</th><th>Destination</th>
      <th>Result</th></tr></thead><tbody>`+shown.map(tr=>{
        const last=tr.hops.length, lastHop=tr.hops[last-1]||{};
        const result=tr.reached?`<span class="badge b-ok">reached in ${last} hops</span>`
          :lastHop.note?`<span class="badge b-crit">refused at hop ${last} ${esc(lastHop.note)}</span>`
          :`<span class="badge b-warn">not reached</span>`;
        const ref=tr.kind==="reference"?null:list.find(x=>x.kind==="reference"&&x.ts<tr.ts);
        return `<tr class="trrow" data-tr="${tr.id}"><td style="font-size:12px;white-space:nowrap">${dt(tr.ts)}</td>
          <td><span class="badge ${KIND_BADGE[tr.kind]||"b-n"}">${esc(tr.kind)}</span></td>
          <td style="font-size:12px">${esc(tr.reason)}</td>
          <td class="mono" style="font-size:12px">${esc(tr.dest)} <span style="color:var(--ink3)">IPv${tr.family}</span></td>
          <td>${result}</td></tr>`+
          (open===tr.id?`<tr><td colspan="5" style="background:var(--panel)">${hopsTable(tr,ref)}</td></tr>`:"");
      }).join("")+`</tbody></table>`;
    document.querySelectorAll("[data-tr]").forEach(r=>r.onclick=()=>{const id=+r.dataset.tr;open=open===id?null:id;draw();});
  };
  const load=async()=>{
    try{list=await api("GET","/api/v1/admin/traceroutes?target="+TR_TARGET+"&limit=100");
      if(open===null&&list.length) open=(list.find(x=>x.kind!=="reference")||list[0]).id; draw();}
    catch(e){$("#trl").innerHTML=`<div class="note">${esc(e.message)}</div>`;}
  };
  loadHops();
  $("#trt").onchange=()=>{TR_TARGET=+$("#trt").value;open=null;load();loadHops();};
  $("#trref").onclick=()=>{load();loadHops();};
  $("#trrun").onclick=async()=>{
    try{await api("POST","/api/v1/admin/traceroutes",{target_id:TR_TARGET});
      toast("Traceroute requested: the result appears in about 10 seconds");
      setTimeout(load,9000);setTimeout(load,16000);}
    catch(e){toast(e.message,true);}
  };
  load();
}

async function viewUpdate(m){
  m.innerHTML=`<h2>Updates</h2>
    <p class="lead">Upload the ZIP of a new version: it is verified (signature, platform,
      checksum), tested, then activated in one click. The previous version stays on disk and
      takes over automatically if the new one fails to start.</p><div id="u">Loading…</div>`;
  let S;
  try{S=await api("GET","/api/v1/admin/update");}catch(e){$("#u").innerHTML=`<div class="note">${esc(e.message)}</div>`;return;}
  const staged=S.staged, av=S.available;
  let h=`<div class="card"><h3>Installed version</h3><div class="body"><table><tbody>
    <tr><td style="width:220px">Version</td><td><strong class="mono">${esc(S.version)}</strong> <span style="color:var(--ink3)">${esc(S.platform)} ${esc(S.build_date||"")}</span></td></tr>
    <tr><td>Previous version</td><td class="mono">${esc(S.previous||"—")}</td></tr>
    <tr><td>In-place updates</td><td>${S.managed?'<span class="badge b-ok">available</span> <span class="mono" style="font-size:12px">'+esc(S.root)+'</span>'
      :'<span class="badge b-crit">unavailable</span> '+esc(S.reason)}</td></tr>
    <tr><td>Release keys</td><td class="mono">${S.trusted_keys.length?S.trusted_keys.map(esc).join(", "):'<span style="color:var(--crit)">none</span>'}
      ${S.allow_unsigned?' <span class="badge b-warn">unsigned packages allowed</span>':""}</td></tr>
    </tbody></table>
    ${S.previous&&S.managed?`<div class="acts"><button class="btn d s" id="rb">Revert to ${esc(S.previous)}</button></div>`:""}
  </div></div>`;
  h+=`<div class="card"><h3>Install a version</h3><div class="body">
    <div class="field"><label>ZIP package (smokestack-VERSION-linux-ARCH.zip)</label>
      <input type="file" id="pkg" accept=".zip,application/zip" ${S.managed?"":"disabled"}></div>
    <button class="btn p" id="up" ${S.managed?"":"disabled"}>Verify the package</button>
    <div id="stg" style="margin-top:14px"></div></div></div>`;
  h+=`<div class="card"><h3>Automatic updates</h3><div class="body">
    <label class="chk"><input type="checkbox" id="ac" ${S.auto_check?"checked":""}><span>Check regularly for new versions
      <small>Source: <span class="mono">${esc(S.manifest_url)}</span></small></span></label>
    <div class="field" style="max-width:320px"><label>How often to check</label>
      <select id="ch">${[[6,"Every 6 hours"],[24,"Every day (default)"],[168,"Every week"],[720,"Every month"]]
        .map(([h,l])=>`<option value="${h}" ${S.check_interval_hours===h?"selected":""}>${l}</option>`).join("")}
        ${[6,24,168,720].includes(S.check_interval_hours)?"":`<option value="${S.check_interval_hours}" selected>Every ${S.check_interval_hours} hours (config.json)</option>`}
      </select>
      <div style="font-size:11.5px;color:var(--ink2);margin-top:4px">A skipped version is never a problem:
        the newest release is installed directly, whatever the current version.</div></div>
    <label class="chk"><input type="checkbox" id="aa" ${S.auto_apply?"checked":""} ${S.managed?"":"disabled"}><span>Install new versions automatically
      <small>Only packages signed by a trusted key are installed automatically, without exception.</small></span></label>
    <div class="acts"><button class="btn s" id="chk">Check now</button></div>
    <div style="margin-top:10px;font-size:13px">${av?(av.newer?`<span class="badge b-warn">version ${esc(av.version)} available</span>
      <button class="btn p s" id="inow" style="margin-left:8px">Install it now</button>`
      :`<span class="badge b-ok">up to date</span> latest published version: ${esc(av.version)}`):""}</div>
  </div></div>`;
  const ACT={update:"update",rollback:"rollback",auto_rollback:'<span class="badge b-crit">automatic rollback</span>'};
  h+=`<div class="card"><h3>History</h3><div class="body">`+(S.history.length?`<table><thead><tr><th>Date</th><th>Action</th><th>From</th><th>To</th><th>By</th></tr></thead><tbody>`+
    S.history.map(x=>`<tr><td>${dt(x.ts)}</td><td>${ACT[x.action]||esc(x.action)}</td><td class="mono">${esc(x.from||"—")}</td>
      <td class="mono">${esc(x.to)}</td><td>${esc(x.by)}</td></tr>`).join("")+`</tbody></table>`:`<div class="empty">No update yet.</div>`)+`</div></div>`;
  $("#u").innerHTML=h;

  const showStaged=st=>{$("#stg").innerHTML=`<div class="pend">
    <div style="display:flex;gap:9px;align-items:baseline;flex-wrap:wrap"><strong>Version ${esc(st.version)}</strong>
      ${st.signed?`<span class="badge b-ok">signed · key ${esc(st.key_id)}</span>`:'<span class="badge b-warn">unsigned</span>'}
      ${st.newer?'<span class="badge b-ok">newer</span>':'<span class="badge b-warn">not newer than '+esc(st.current)+'</span>'}</div>
    <div style="font-size:12px;color:var(--ink2);margin-top:4px">${esc(st.os)}-${esc(st.arch)} · built ${esc(st.built_at||"?")}
      · SHA-256 <span class="mono">${esc(st.sha256.slice(0,16))}…</span> · self-test passed</div>
    ${st.notes?`<div class="quote">${esc(st.notes)}</div>`:""}
    ${st.newer?"":`<label class="chk"><input type="checkbox" id="frc"><span>Force installing an older or identical version</span></label>`}
    <div class="acts"><button class="btn p" id="ap">Install and restart</button></div></div>`;
    $("#ap").onclick=async()=>{
      if(!confirm("Install version "+st.version+"? The service restarts (a few seconds).")) return;
      try{await api("POST","/api/v1/admin/update/apply",{force:!!($("#frc")&&$("#frc").checked)});waitRestart(st.version);}
      catch(e){toast(e.message,true);}
    };
  };
  if(staged) showStaged(staged);
  if($("#up")) $("#up").onclick=async()=>{
    const f=$("#pkg").files[0]; if(!f){toast("Choose a ZIP file",true);return;}
    const fd=new FormData(); fd.append("package",f);
    $("#up").disabled=true;$("#up").textContent="Verifying…";
    try{
      const r=await fetch("/api/v1/admin/update/upload",{method:"POST",body:fd,headers:{"X-CSRF-Token":CSRF},credentials:"same-origin"});
      const d=await r.json(); if(!r.ok) throw new Error(d.error||("HTTP "+r.status));
      showStaged(d);
    }catch(e){toast(e.message,true);}
    $("#up").disabled=false;$("#up").textContent="Verify the package";
  };
  if($("#rb")) $("#rb").onclick=async()=>{
    if(!confirm("Revert to version "+S.previous+"?")) return;
    try{await api("POST","/api/v1/admin/update/rollback");waitRestart(S.previous);}catch(e){toast(e.message,true);}
  };
  const save=async()=>{try{await api("PUT","/api/v1/admin/update/settings",
      {auto_check:$("#ac").checked,auto_apply:$("#aa").checked,check_interval_hours:parseInt($("#ch").value,10)});
      toast("Preferences saved");}
    catch(e){toast(e.message,true);}};
  $("#ac").onchange=save;$("#aa").onchange=save;$("#ch").onchange=save;
  $("#chk").onclick=async()=>{try{await api("POST","/api/v1/admin/update/check");render();}catch(e){toast(e.message,true);}};
  if($("#inow")) $("#inow").onclick=async()=>{
    if(!confirm("Install version "+av.version+" now? The service restarts (a few seconds).")) return;
    try{await api("POST","/api/v1/admin/update/install-latest");waitRestart(av.version);}
    catch(e){toast(e.message,true);}
  };
}
async function waitRestart(ver){
  $("#u").innerHTML=`<div class="card"><div class="body"><strong>Restarting on version ${esc(ver)}…</strong>
    <p class="lead" style="margin-top:6px">This page reloads by itself.</p></div></div>`;
  for(let i=0;i<60;i++){
    await new Promise(r=>setTimeout(r,1500));
    try{const v=await fetch("/api/v1/version",{cache:"no-store"}).then(r=>r.json());
      if(v.version===ver){toast("Version "+ver+" is running");render();return;}}catch(e){}
  }
  toast("The service is not answering yet: check journalctl -u smokestack",true);
}

async function viewChannels(m){
  m.innerHTML=`<h2>Notification channels</h2>
    <p class="lead">Where alerts go: email through your own SMTP server or the local sendmail, a chat room,
      or SMS. Every channel gets the alerts of <em>My targets alerting</em> and of the federation NOC.
      Chat and SMS receive a shortened message — a traceroute is unreadable on a phone — while email and
      webhook carry the whole thing. <strong>Test each channel</strong>: one that is never tested is one
      that fails the night it matters.</p>
    <div id="chans"></div>
    <div class="acts"><select id="newkind">${CHAN_KINDS.map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join("")}</select>
      <button class="btn" id="addchan">Add this channel</button>
      <button class="btn p" id="savechans">Save</button></div>`;
  let SET={channels:[]};
  const draw=()=>{
    $("#chans").innerHTML=SET.channels.length?SET.channels.map((c,i)=>`
      <div class="card"><h3>${esc(CHAN_KINDS.find(k=>k[0]===c.kind)?.[1]||c.kind)}</h3><div class="body">
        <div class="row2">
          <div class="field"><label>Name</label><input data-f="${i}:name" value="${esc(c.name||"")}"></div>
          ${(CHAN_FIELDS[c.kind]||[]).map(([f,label,ph])=>`<div class="field"><label>${esc(label)}</label>
            <input data-f="${i}:${f}" value="${esc(c[f]==null?"":String(c[f]))}" placeholder="${esc(ph)}"></div>`).join("")}
        </div>
        <label class="chk"><input type="checkbox" data-f="${i}:enabled" ${c.enabled?"checked":""}><span>Enabled</span></label>
        <div class="acts"><button class="btn s" data-test="${i}">Send a test message</button>
          <button class="btn d s" data-rm="${i}">Remove</button></div>
      </div></div>`).join(""):`<div class="empty">No channel yet. Alerts have nowhere to go.</div>`;
    document.querySelectorAll("[data-f]").forEach(el=>el.onchange=()=>{
      const [i,f]=el.dataset.f.split(":");
      SET.channels[i][f]= el.type==="checkbox" ? el.checked : (f==="port"? parseInt(el.value||"0",10) : el.value);
    });
    document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{SET.channels.splice(+b.dataset.rm,1);draw();});
    document.querySelectorAll("[data-test]").forEach(b=>b.onclick=async()=>{
      const c=SET.channels[+b.dataset.test];
      if(!c.id){toast("Save first, then test",true);return;}
      b.disabled=true;b.textContent="Sending…";
      try{await api("POST","/api/v1/admin/channels/test",{id:c.id});toast("Test message sent through "+(c.name||c.kind));}
      catch(e){toast(e.message,true);}
      b.disabled=false;b.textContent="Send a test message";
    });
  };
  try{ SET=await api("GET","/api/v1/admin/channels")||{channels:[]}; SET.channels=SET.channels||[]; }catch(e){}
  draw();
  $("#addchan").onclick=()=>{SET.channels.push({kind:$("#newkind").value,enabled:true,
    name:CHAN_KINDS.find(k=>k[0]===$("#newkind").value)[1]});draw();};
  $("#savechans").onclick=async()=>{
    try{await api("PUT","/api/v1/admin/channels",SET);toast("Channels saved");render();}
    catch(e){toast(e.message,true);}
  };
}

async function viewAlerts(m){
  m.innerHTML=`<h2>Alerts on your own targets</h2>
    <p class="lead">Warns you when one of <em>your</em> targets stays in incident. Different from the
      federation alerting above, which warns a peer's NOC about their network.
      A traceroute is taken the moment the incident opens, and its path — compared with the last
      healthy one — travels in the message, so you know where it breaks before opening anything.</p>
    <div class="card"><div class="body" id="al">Loading…</div></div>
    <div class="card"><h3>Recent incidents</h3><div class="body" id="alinc">Loading…</div></div>`;
  try{
    const d=await api("GET","/api/v1/admin/alerts"); const c=d.config||{};
    $("#al").innerHTML=`
      <label class="chk"><input type="checkbox" id="al_en" ${c.enabled?"checked":""}>
        <span>Alert me when a target stays in incident<small>Off by default. This is the global switch;
          each target can also be left out, with the <em>Alerts</em> button in
          <a href="#" data-goto="targets">Targets and categories</a>.</small></span></label>
      <div class="row2">
        <div class="field"><label>After how long (minutes)</label>
          <input id="al_min" type="number" min="1" max="1440" value="${c.after_minutes||5}"></div>
        <div class="field"><label>Silence between two alerts for one target (hours)</label>
          <input id="al_rep" type="number" min="1" max="168" value="${c.repeat_hours||6}"></div>
        <div class="field"><label>Recipients (never public)</label>
          <input id="al_to" value="${esc(c.recipients||"")}" placeholder="noc@example.net, astreinte@example.net"></div>
        <div class="field"><label>Webhook (optional)</label>
          <input id="al_hook" value="${esc(c.webhook_url||"")}" placeholder="https://hooks.example.net/…"></div>
      </div>
      <label class="chk"><input type="checkbox" id="al_rec" ${c.recovery!==false?"checked":""}>
        <span>Also tell me when it is over</span></label>
      <div class="note">Alerts leave through the channels configured in
        <a href="#" data-goto="channels">Notification channels</a> (SMTP, chat, SMS), plus the
        addresses and webhook below if you set them.</div>
      <button class="btn p" id="al_save">Save</button>`;
    document.querySelectorAll("[data-goto]").forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.goto);});
    $("#al_save").onclick=async()=>{
      try{await api("PUT","/api/v1/admin/alerts",{enabled:$("#al_en").checked,
        after_minutes:parseInt($("#al_min").value,10),repeat_hours:parseInt($("#al_rep").value,10),
        recipients:$("#al_to").value,webhook_url:$("#al_hook").value,recovery:$("#al_rec").checked});
        toast("Saved");}catch(e){toast(e.message,true);}
    };
    const L=d.incidents||[];
    $("#alinc").innerHTML=L.length?`<table><thead><tr><th>Target</th><th>Opened</th><th>Lasted</th>
      <th>Alerted</th><th>State</th></tr></thead><tbody>`+L.map(i=>{
      const end=i.closed_at||Math.floor(Date.now()/1000);
      const mins=Math.max(0,Math.round((end-i.opened_at)/60));
      return `<tr><td>${esc(i.title||("#"+i.target_id))}<div class="mono" style="font-size:11.5px;color:var(--ink2)">${esc(i.host||"")}</div></td>
        <td>${new Date(i.opened_at*1000).toLocaleString()}</td>
        <td>${mins} min</td>
        <td>${i.notified_at?'<span class="badge b-warn">sent</span>':'<span class="badge b-n">no</span>'}</td>
        <td>${i.closed_at?'<span class="badge b-ok">closed</span>':'<span class="badge b-crit">open</span>'}</td></tr>`;
    }).join("")+`</tbody></table>`:`<div class="empty">No incident recorded yet.</div>`;
  }catch(e){$("#al").innerHTML=`<div class="note">${esc(e.message)}</div>`;}
}

    <p class="lead">Messages sent from the contact form of the public “About” page. Your address is

    document.querySelectorAll("[data-read]").forEach(b=>b.onclick=async()=>{

async function viewUsers(m){
  m.innerHTML=`<h2>Users</h2>
    <p class="lead"><strong>master</strong> manages accounts and everything else.
      <strong>admin</strong> manages configuration, federation and storage, but not accounts.
      <strong>editor</strong> only manages targets and categories. <strong>viewer</strong> is read-only.
      At least one active master account must always remain.</p>
    <div class="card"><h3>New account</h3><div class="body"><div class="row2">
      <div class="field"><label>Email</label><input id="ue" type="email"></div>
      <div class="field"><label>Display name</label><input id="un"></div>
      <div class="field"><label>Password</label><input id="up" type="password"></div>
      <div class="field"><label>Role</label><select id="ur">

    <div class="card"><h3>Accounts</h3><div class="body" id="l">Loading…</div></div>`;
  $("#add").onclick=async()=>{
    try{
      await api("POST","/api/v1/admin/users",{email:$("#ue").value,name:$("#un").value,
        password:$("#up").value,role:$("#ur").value});
      toast("Account created");render();
    }catch(e){toast(e.message,true);}
  };
  try{
    const list=await api("GET","/api/v1/admin/users");

      <th>Last sign-in</th><th></th></tr></thead><tbody>`+
      list.map(u=>`<tr class="${u.disabled?"dis":""}">

        <td>${esc(u.display_name)}</td>
        <td><select data-role="${u.id}" style="width:auto;padding:3px 7px">`+
          ["viewer","editor","admin","master"].map(r=>`<option ${u.role===r?"selected":""}>${r}</option>`).join("")+`</select></td>
        <td style="font-size:12px">${dt(u.last_login_at)}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn s" data-dis="${u.id}" data-on="${u.disabled?0:1}">${u.disabled?"Enable":"Disable"}</button>
          <button class="btn s" data-rst="${u.id}">Reset password</button>
          ${u.id!==ME.id?`<button class="btn d s" data-udel="${u.id}">Delete</button>`:""}
        </td></tr>`).join("")+`</tbody></table>`;
    document.querySelectorAll("[data-role]").forEach(s=>s.onchange=async()=>{
      try{await api("PATCH","/api/v1/admin/users/"+s.dataset.role,{role:s.value});
        toast("Role changed");render();}catch(e){toast(e.message,true);render();}
    });
    document.querySelectorAll("[data-dis]").forEach(b=>b.onclick=async()=>{
      try{await api("PATCH","/api/v1/admin/users/"+b.dataset.dis,{disabled:b.dataset.on==="1"});
        toast("Account updated");render();}catch(e){toast(e.message,true);}
    });
    document.querySelectorAll("[data-rst]").forEach(b=>b.onclick=async()=>{
      const pw=prompt("New password (12 characters minimum)");if(!pw) return;
      try{await api("PATCH","/api/v1/admin/users/"+b.dataset.rst,{password:pw});

    });
    document.querySelectorAll("[data-udel]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Delete this account?")) return;
      try{await api("DELETE","/api/v1/admin/users/"+b.dataset.udel);

    });
  }catch(e){$("#l").innerHTML=`<div class="note">${esc(e.message)}</div>`;}
}

async function viewShares(m){
  m.innerHTML=`<h2>Share links</h2>
    <p class="lead">Read-only links to a single target, for someone without an account — a customer,
      a peer's NOC, a provider on a ticket. A link opens that one target and nothing else, is never
      indexed, and can be revoked here. The token is stored hashed: a copy of the database does not
      hand over working links, and a link is shown only once, when created (from the target list).</p>
    <div class="card"><div class="body" id="shl">Loading…</div></div>`;
  try{
    const L=await api("GET","/api/v1/admin/shares");
    $("#shl").innerHTML=(L&&L.length)?`<table class="resp"><thead><tr><th>Target</th><th>Note</th>
      <th>Created</th><th>Expires</th><th>Used</th><th></th></tr></thead><tbody>`+L.map(l=>`<tr>
      <td class="ttl" data-l=""><div>${esc(l.title||("#"+l.target_id))}</div>
        <div style="font-size:11.5px;color:var(--ink3)">by ${esc(l.created_by||"—")}</div></td>
      <td data-l="Note">${esc(l.note||"—")}</td>
      <td data-l="Created">${new Date(l.created_at*1000).toLocaleDateString()}</td>
      <td data-l="Expires">${l.expires_at?
        (l.expires_at*1000<Date.now()?'<span class="badge b-crit">expired</span>':new Date(l.expires_at*1000).toLocaleDateString())
        :'<span class="badge b-warn">never</span>'}</td>
      <td data-l="Used">${l.uses||0}${l.last_used?" · "+new Date(l.last_used*1000).toLocaleDateString():""}</td>
      <td class="acts" data-l=""><button class="btn d s" data-rev="${l.id}">Revoke</button></td>
      </tr>`).join("")+`</tbody></table>`:`<div class="empty">No share link. Create one from the target list.</div>`;
    document.querySelectorAll("[data-rev]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Revoke this link? Whoever has it loses access immediately.")) return;
      try{await api("DELETE","/api/v1/admin/shares/"+b.dataset.rev);toast("Link revoked");render();}
      catch(e){toast(e.message,true);}
    });
  }catch(e){$("#shl").innerHTML=`<div class="note">${esc(e.message)}</div>`;}
}

async function viewLogs(m){
  m.innerHTML=`<h2>Service log</h2>
    <p class="lead">The last lines the service wrote, kept in memory. The same lines go to
      <span class="mono">journalctl -u smokestack</span> or <span class="mono">docker compose logs</span>,
      which hold the full history; this screen is for when you do not have a shell at hand.
      One line appears when a target starts failing, with the reason, and one when it answers again.</p>
    <div class="acts">
      <input id="lgf" placeholder="filter, e.g. target or update" style="max-width:280px">
      <label class="chk" style="margin:0"><input type="checkbox" id="lgauto"><span>Refresh every 5 s</span></label>
      <button class="btn" id="lgr">Refresh</button></div>
    <div class="card"><div class="body" style="padding:0"><pre id="lg" style="margin:0;padding:12px;
      max-height:65vh;overflow:auto;font-size:12px;line-height:1.5;white-space:pre-wrap">Loading…</pre></div></div>
    <div id="lgnote"></div>`;
  let TIMER=null;
  const load=async()=>{
    try{
      const d=await api("GET","/api/v1/admin/logs");
      const f=$("#lgf").value.trim().toLowerCase();
      const lines=(d.lines||[]).filter(l=>!f||l.toLowerCase().includes(f));
      $("#lg").textContent=lines.length?lines.join("\n"):"(nothing yet)";
      $("#lg").scrollTop=$("#lg").scrollHeight;
      $("#lgnote").innerHTML=d.probe?"":`<div class="note">The probe runs in its own process: its own
        lines are in <span class="mono">journalctl -u smokestack-probe</span> or in the container log,
        not here.</div>`;
    }catch(e){$("#lg").textContent=e.message;}
  };
  $("#lgr").onclick=load; $("#lgf").oninput=load;
  $("#lgauto").onchange=()=>{ if($("#lgauto").checked){TIMER=setInterval(load,5000);} else {clearInterval(TIMER);} };
  load();
}

(async()=>{
  try{
    const st=await api("GET","/api/v1/auth/state");
    if(st.setup_required) return gateSetup();
    if(st.user){CSRF=st.csrf;ME=st.user;
      try{const p=await api("GET","/api/v1/admin/fed/pairing");
        PENDING=(p||[]).filter(x=>x.direction==="in"&&x.state==="pending").length;}catch(e){}
  try{const d=await api("GET","/api/v1/admin/messages");UNREAD=d.unread||0;}catch(e){}
      return shell();}
    gateLogin();
  }catch(e){
    $("#app").innerHTML=`<div class="gate"><div class="gatebox">
      <h1>Instance unreachable</h1><p class="sub">${esc(e.message)}</p></div></div>`;
  }
})();
