<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%232458e6%27/%3E%3Cstop offset=%271%27 stop-color=%27%230e8fa8%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M7 12h18M7 20h18%27 stroke=%27white%27 stroke-width=%272.5%27 stroke-linecap=%27round%27 opacity=%27.9%27/%3E%3C/svg%3E">
<title>smokestack — administration</title>
<style>
  :root{--ink:#0f172a;--ink2:#64748b;--ink3:#94a3b8;--line:#e4e9f0;--line2:#f1f5f9;
        --panel:#f8fafc;--blue:#2563eb;--ok:#15803d;--warn:#b45309;--crit:#dc2626}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;width:100%;padding:7px 10px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;outline-offset:-1px;border-color:#93c5fd}
  label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
  .field{margin-bottom:11px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;
       font-size:13px;color:var(--ink)}
  .btn:hover{border-color:#93c5fd}
  .btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.p:hover{background:#1d4ed8}
  .btn.d{border-color:#fecaca;color:var(--crit)}
  .btn.d:hover{background:#fef2f2}
  .btn.s{padding:4px 10px;font-size:12px}
  .row2{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}

  /* écrans d'entrée */
  .gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--panel)}
  .gatebox{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);
           border-radius:14px;padding:26px}
  .gatebox h1{font-size:18px;margin:0 0 4px}
  .gatebox p.sub{font-size:13px;color:var(--ink2);margin:0 0 18px}
  .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#2563eb,#0891b2);
        display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;margin-bottom:14px}

  /* ossature */
  .top{border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:10}
  .topin{display:flex;align-items:center;gap:14px;height:56px;padding:0 clamp(14px,2.5vw,28px)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600}
  .brand .logo{margin:0;width:22px;height:22px;font-size:11px}
  .spacer{flex:1}
  .who{font-size:12px;color:var(--ink2);text-align:right;line-height:1.3}
  .badge{border-radius:999px;padding:2px 9px;font-size:11px;font-weight:500}
  .b-ok{background:#f0fdf4;color:var(--ok)}
  .b-warn{background:#fffbeb;color:var(--warn)}
  .b-crit{background:#fef2f2;color:var(--crit)}
  .b-n{background:var(--line2);color:var(--ink2)}

  .shell{display:grid;grid-template-columns:1fr;gap:0}
  @media(min-width:900px){.shell{grid-template-columns:212px minmax(0,1fr)}}
  nav.side{border-right:1px solid var(--line);padding:14px 10px;background:var(--panel)}
  @media(min-width:900px){nav.side{min-height:calc(100vh - 56px)}}
  nav.side button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    background:none;border:none;padding:8px 11px;border-radius:8px;font-size:13px;color:var(--ink2)}
  nav.side button:hover{background:#fff}
  nav.side button[aria-current="true"]{background:#eff6ff;color:#1d4ed8;font-weight:500}
  nav.side .grp{font-size:10px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink3);margin:14px 11px 5px}
  nav.side .n{margin-left:auto;background:var(--crit);color:#fff;border-radius:999px;
    font-size:10px;padding:1px 6px;font-weight:600}

  main{padding:clamp(16px,2.4vw,28px);min-width:0}
  h2{font-size:17px;font-weight:600;margin:0 0 3px;letter-spacing:-.01em}
  .lead{font-size:13px;color:var(--ink2);margin:0 0 20px}
  .card{border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
  .card h3{margin:0;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;
           font-weight:600;display:flex;align-items:center;gap:8px}
  .card .body{padding:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:500;color:var(--ink2);font-size:11px;text-transform:uppercase;
     letter-spacing:.03em;padding:6px 10px}
  td{padding:9px 10px;border-top:1px solid var(--line2);vertical-align:middle}
  tr.dis td{opacity:.55}
  .note{font-size:12px;color:var(--ink2);background:var(--panel);border-radius:8px;
        padding:10px 12px;margin-bottom:12px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:100;
    background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;
    box-shadow:0 6px 24px rgba(15,23,42,.25);display:none;max-width:90vw}
  .toast.err{background:var(--crit)}
  .fp{font-size:15px;letter-spacing:.06em;font-weight:600}
  .empty{font-size:13px;color:var(--ink3);padding:6px 0}
  .pend{border:1px solid #fed7aa;background:#fffbeb;border-radius:10px;padding:13px;margin-bottom:10px}
  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .quote{border-left:3px solid #fdba74;padding:6px 11px;margin:8px 0;font-size:13px;background:#fff}
  .quote.priv{border-left-color:#a5b4fc;background:#f5f7ff}
  .quote .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);display:block;margin-bottom:2px}
  .counter{font-size:11px;color:var(--ink3);text-align:right;margin-top:3px}
  .counter.bad{color:var(--crit)}
  .chk{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--ink);margin:10px 0}
  .chk input{width:auto;margin-top:3px}
  .chk small{display:block;color:var(--ink2);font-size:12px}
  .bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;min-width:90px}
  .bar i{display:block;height:100%;background:var(--ok)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let CSRF="", ME=null, VIEW="dash", PENDING=0, LANGS=[];

function toast(msg,err){
  const t=$("#toast");t.textContent=msg;t.className="toast"+(err?" err":"");
  t.style.display="block";clearTimeout(t._t);
  t._t=setTimeout(()=>t.style.display="none",err?5200:2600);
}
async function api(method,path,body){
  const h={};
  if(body!==undefined){h["Content-Type"]="application/json";}
  if(CSRF) h["X-CSRF-Token"]=CSRF;
  const r=await fetch(path,{method,headers:h,
    body:body!==undefined?JSON.stringify(body):undefined,credentials:"same-origin"});
  if(r.status===204) return null;
  let data=null;
  try{ data=await r.json(); }catch(e){}
  if(!r.ok) throw new Error((data&&data.error)||("HTTP "+r.status));
  return data;
}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=ts=>ts?new Date(ts*1000).toLocaleString("fr-FR",
  {day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
const gb=b=>(b/1073741824).toFixed(2)+" Go";

/* ---------------------------------------------- écrans d'entrée */
function gateSetup(){
  $("#app").innerHTML=`<div class="gate"><div class="gatebox">
    <div class="logo">S</div>
    <h1>Première configuration</h1>
    <p class="sub">Aucun compte n'existe encore. Créez le compte master :
      il pourra gérer les utilisateurs et toute la configuration.</p>
    <div class="field"><label>Code d'installation</label><input id="c" class="mono" placeholder="XXXX-XXXX-XXXX" autocomplete="off">
      <div style="font-size:11.5px;color:var(--ink2);margin-top:4px">Affiché dans le journal du service
        (<span class="mono">journalctl -u smokestack</span>) et dans <span class="mono">/var/lib/smokestack/setup-code</span>.</div></div>
    <div class="field"><label>Adresse de courriel</label><input id="e" type="email" autocomplete="username"></div>
    <div class="field"><label>Nom affiché</label><input id="n" type="text"></div>
    <div class="field"><label>Mot de passe (12 caractères minimum)</label>
      <input id="p" type="password" autocomplete="new-password"></div>
    <button class="btn p" id="go" style="width:100%">Créer le compte master</button>
  </div></div>`;
  const go=async()=>{
    try{
      const r=await api("POST","/api/v1/auth/setup",
        {setup_code:$("#c").value,email:$("#e").value,name:$("#n").value,password:$("#p").value});
      CSRF=r.csrf;ME=r.user;shell();
    }catch(e){toast(e.message,true);}
  };
  $("#go").onclick=go;
  $("#p").onkeydown=e=>{if(e.key==="Enter")go();};
}
function gateLogin(){
  $("#app").innerHTML=`<div class="gate"><div class="gatebox">
    <div class="logo">S</div>
    <h1>Administration</h1>
    <p class="sub">Connectez-vous pour accéder au back-office.</p>
    <div class="field"><label>Adresse de courriel</label><input id="e" type="email" autocomplete="username"></div>
    <div class="field"><label>Mot de passe</label><input id="p" type="password" autocomplete="current-password"></div>
    <button class="btn p" id="go" style="width:100%">Se connecter</button>
    <p class="sub" style="margin:16px 0 0;font-size:12px">
      <a href="/" style="color:var(--blue)">← Retour aux graphes publics</a></p>
  </div></div>`;
  const go=async()=>{
    try{
      const r=await api("POST","/api/v1/auth/login",
        {email:$("#e").value,password:$("#p").value});
      CSRF=r.csrf;ME=r.user;shell();
    }catch(e){toast(e.message,true);}
  };
  $("#go").onclick=go;
  $("#p").onkeydown=e=>{if(e.key==="Enter")go();};
}

/* ------------------------------------------------------ ossature */
const NAV=[
  {grp:"Supervision"},
  {id:"dash",  label:"Tableau de bord", min:1},
  {id:"targets",label:"Cibles et catégories", min:2},
  {grp:"Fédération"},
  {id:"fed",   label:"Pairs et appairage", min:3, badge:true},
  {id:"notify",label:"Alerting NOC", min:3},
  {grp:"Instance"},
  {id:"storage",label:"Stockage", min:3},
  {id:"site",  label:"Page éditeur", min:3},
  {id:"net",   label:"Réseau hôte", min:3},
  {id:"langs", label:"Langues", min:3},
  {id:"update",label:"Mise à jour", min:4},
  {grp:"Comptes"},
  {id:"users", label:"Utilisateurs", min:4},
  {id:"audit", label:"Journal", min:3}
];
const LVL={viewer:1,editor:2,admin:3,master:4};

function shell(){
  let nav="";
  for(const n of NAV){
    if(n.grp){nav+=`<div class="grp">${n.grp}</div>`;continue;}
    if(LVL[ME.role]<n.min) continue;
    nav+=`<button data-v="${n.id}" aria-current="${VIEW===n.id}">${n.label}`+
      (n.badge&&PENDING?`<span class="n">${PENDING}</span>`:"")+`</button>`;
  }
  $("#app").innerHTML=`
    <div class="top"><div class="topin">
      <div class="brand"><span class="logo">S</span><span>smokestack</span>
        <span class="badge b-n" style="margin-left:6px">admin</span></div>
      <span class="spacer"></span>
      <div class="who"><div>${esc(ME.display_name)}</div>
        <div><span class="badge b-n">${ME.role}</span></div></div>
      <button class="btn s" id="pw">Mot de passe</button>
      <button class="btn s" id="out">Quitter</button>
    </div></div>
    <div class="shell"><nav class="side">${nav}</nav><main id="main"></main></div>`;
  $("#out").onclick=async()=>{await api("POST","/api/v1/auth/logout");location.reload();};
  $("#pw").onclick=changePassword;
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;shell();});
  render();
}

async function changePassword(){
  const cur=prompt("Mot de passe actuel");if(!cur) return;
  const nw=prompt("Nouveau mot de passe (12 caractères minimum)");if(!nw) return;
  try{
    await api("POST","/api/v1/auth/password",{current:cur,new:nw});
    toast("Mot de passe changé, reconnectez-vous");
    setTimeout(()=>location.reload(),1200);
  }catch(e){toast(e.message,true);}
}

function render(){
  const m=$("#main");
  if(VIEW==="dash") return viewDash(m);
  if(VIEW==="targets") return viewTargets(m);
  if(VIEW==="fed") return viewFed(m);
  if(VIEW==="notify") return viewNotify(m);
  if(VIEW==="storage") return viewStorage(m);
  if(VIEW==="site") return viewSite(m);
  if(VIEW==="net") return viewNet(m);
  if(VIEW==="langs") return viewLangs(m);
  if(VIEW==="update") return viewUpdate(m);
  if(VIEW==="users") return viewUsers(m);
  if(VIEW==="audit") return viewAudit(m);
}

/* -------------------------------------------- tableau de bord */
async function viewDash(m){
  m.innerHTML=`<h2>Tableau de bord</h2>
    <p class="lead">État de l'instance, de la sonde et du stockage.</p>
    <div id="d">Chargement…</div>`;
  try{
    const [tree,st,peers]=await Promise.all([
      api("GET","/api/v1/tree"),
      api("GET","/api/v1/admin/storage").catch(()=>null),
      api("GET","/api/v1/fed/peers").catch(()=>[])
    ]);
    const nT=(tree||[]).reduce((a,c)=>a+(c.targets||[]).length,0);
    const rep=st&&st.report?st.report:{};
    $("#d").innerHTML=`
      <div class="row2">
        <div class="card"><div class="body"><div style="font-size:11px;color:var(--ink2)">Catégories</div>
          <div style="font-size:22px;font-weight:600">${(tree||[]).length}</div></div></div>
        <div class="card"><div class="body"><div style="font-size:11px;color:var(--ink2)">Cibles</div>
          <div style="font-size:22px;font-weight:600">${nT}</div></div></div>
        <div class="card"><div class="body"><div style="font-size:11px;color:var(--ink2)">Pairs approuvés</div>
          <div style="font-size:22px;font-weight:600">${(peers||[]).length}</div></div></div>
        <div class="card"><div class="body"><div style="font-size:11px;color:var(--ink2)">Archive locale</div>
          <div style="font-size:22px;font-weight:600">${gb(rep.local_bytes||0)}</div></div></div>
      </div>
      <div class="card"><h3>Stockage</h3><div class="body">
        <table><tbody>
          <tr><td>Mode</td><td><span class="badge b-n">${esc(rep.mode||"—")}</span></td></tr>
          <tr><td>Occupation disque</td><td>${((rep.disk_used_pct||0)*100).toFixed(1)} %
            ${rep.degraded?'<span class="badge b-crit">mode dégradé</span>':""}</td></tr>
          <tr><td>Chunks locaux</td><td>${rep.chunks||0}</td></tr>
          <tr><td>Uploads en attente</td><td>${rep.pending_uploads||0}</td></tr>
          <tr><td>Rétention projetée</td><td>${rep.projected_days
            ?rep.projected_days.toFixed(0)+" jours au rythme actuel":"—"}</td></tr>
        </tbody></table></div></div>`;
  }catch(e){$("#d").innerHTML=`<div class="note">${esc(e.message)}</div>`;}
}

/* ------------------------------------------------- cibles */
async function viewTargets(m){
  m.innerHTML=`<h2>Cibles et catégories</h2>
    <p class="lead">La rafale doit tenir dans l'intervalle :
      paquets × espacement + délai d'attente doit rester sous 75 % de l'intervalle.
      À 30 s, comptez 10 paquets espacés de 200 ms.</p>
    <div class="card"><h3>Nouvelle catégorie</h3><div class="body">
      <div class="row2">
        <div class="field"><label>Identifiant court</label><input id="cslug" placeholder="transitaires"></div>
        <div class="field"><label>Libellé FR</label><input id="cfr" placeholder="Transitaires"></div>
        <div class="field"><label>Libellé EN</label><input id="cen" placeholder="Transit"></div>
      </div>
      <button class="btn p" id="addcat">Créer la catégorie</button>
    </div></div>
    <div class="card"><h3>Nouvelle cible</h3><div class="body">
      <div class="row2">
        <div class="field"><label>Catégorie</label><select id="tcat"></select></div>
        <div class="field"><label>Intitulé</label><input id="ttitle" placeholder="Cogent Paris"></div>
        <div class="field"><label>Hôte ou IP</label><input id="thost" placeholder="38.0.0.1"></div>
        <div class="field"><label>Protocole</label><select id="tproto">
          <option value="icmp">ICMP</option><option value="tcp">TCP connect</option></select></div>
        <div class="field"><label>Intervalle</label><select id="tiv">
          <option value="30">30 s</option><option value="60" selected>60 s</option>
          <option value="300">5 min</option><option value="600">10 min</option></select></div>
        <div class="field"><label>Paquets</label><input id="tpk" type="number" value="20"></div>
        <div class="field"><label>Espacement (ms)</label><input id="tsp" type="number" value="500"></div>
        <div class="field"><label>Délai d'attente (ms)</label><input id="tto" type="number" value="2000"></div>
      </div>
      <button class="btn p" id="addtgt">Créer la cible</button>
    </div></div>
    <div class="card"><h3>Cibles actives</h3><div class="body" id="tlist">Chargement…</div></div>`;

  const tree=await api("GET","/api/v1/tree").catch(()=>[]);
  $("#tcat").innerHTML=(tree||[]).map(c=>
    `<option value="${c.id}">${esc(c.menu_fr)}</option>`).join("")||
    `<option value="">— créez d'abord une catégorie —</option>`;

  $("#addcat").onclick=async()=>{
    try{
      await api("POST","/api/v1/admin/categories",
        {slug:$("#cslug").value,menu_fr:$("#cfr").value,menu_en:$("#cen").value});
      toast("Catégorie créée");render();
    }catch(e){toast(e.message,true);}
  };
  $("#addtgt").onclick=async()=>{
    try{
      await api("POST","/api/v1/admin/targets",{
        category_id:parseInt($("#tcat").value,10),title:$("#ttitle").value,
        host:$("#thost").value,proto:$("#tproto").value,
        interval_s:parseInt($("#tiv").value,10),packets:parseInt($("#tpk").value,10),
        spacing_ms:parseInt($("#tsp").value,10),timeout_ms:parseInt($("#tto").value,10),
        public:true,enabled:true});
      toast("Cible créée");render();
    }catch(e){toast(e.message,true);}
  };

  try{
    const [list,feat]=await Promise.all([api("GET","/api/v1/admin/targets"),api("GET","/api/v1/admin/featured").catch(()=>[])]);
    const F=new Set(feat||[]);
    $("#tlist").innerHTML=(list&&list.length)?`<table>
      <thead><tr><th title="Cible critique : toujours affichée en tête de l'accueil">★</th><th>Intitulé</th><th>Hôte</th><th>Proto</th><th>Intervalle</th>
      <th>Paquets</th><th></th></tr></thead><tbody>`+
      list.map(t=>`<tr><td><button class="btn s" data-star="${t.id}" title="Cible critique"
          style="color:${F.has(t.id)?"#d97706":"var(--ink3)"}">${F.has(t.id)?"★":"☆"}</button></td>
        <td>${esc(t.title)}</td><td class="mono">${esc(t.host)}</td>
        <td>${esc(t.proto)}</td><td>${t.interval_s} s</td><td>${t.packets}</td>
        <td style="text-align:right"><button class="btn d s" data-del="${t.id}">Supprimer</button></td>
        </tr>`).join("")+`</tbody></table>`:`<div class="empty">Aucune cible.</div>`;
    document.querySelectorAll("[data-star]").forEach(b=>b.onclick=async()=>{
      const id=+b.dataset.star;F.has(id)?F.delete(id):F.add(id);
      try{await api("PUT","/api/v1/admin/featured",[...F]);toast("Cibles critiques mises à jour");render();}
      catch(e){toast(e.message,true);}
    });
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Supprimer cette cible ? L'historique est conservé.")) return;
      try{await api("DELETE","/api/v1/admin/targets/"+b.dataset.del);
        toast("Cible supprimée");render();}catch(e){toast(e.message,true);}
    });
  }catch(e){$("#tlist").innerHTML=`<div class="note">${esc(e.message)}</div>`;}
}

/* ---------------------------------------------- fédération */
async function viewFed(m){
  m.innerHTML=`<h2>Pairs et appairage</h2>
    <p class="lead">L'appairage demande un accord humain des deux côtés. Vous envoyez une demande
      motivée à l'URL publique d'une autre instance ; son administrateur la voit arriver ici,
      compare votre empreinte avec celle communiquée hors bande, lit votre justification, puis
      accepte ou refuse. L'affichage public d'un appairage exige lui aussi l'accord des deux parties.</p>
    <div id="f">Chargement…</div>`;
  try{
    const [id,pairings,peers,info]=await Promise.all([
      api("GET","/api/v1/admin/fed/identity"),
      api("GET","/api/v1/admin/fed/pairing"),
      api("GET","/api/v1/admin/fed/peers"),
      api("GET","/api/v1/fed/pairing/info").catch(()=>({min_justification:20}))
    ]);
    const MINJ=info.min_justification||20;
    const inbound=(pairings||[]).filter(p=>p.direction==="in"&&p.state==="pending");
    const outbound=(pairings||[]).filter(p=>p.direction==="out");
    PENDING=inbound.length;

    let html=`<div class="card"><h3>Notre identité</h3><div class="body">
      <table><tbody>
        <tr><td style="width:190px">Numéro d'AS</td><td class="mono">${esc(id.profile.asn||"— non renseigné —")}</td></tr>
        <tr><td>Organisation</td><td>${esc(id.profile.org||"—")}</td></tr>
        <tr><td>Page d'appairage à communiquer</td><td class="mono">${esc((id.profile.url||"")+"/pairing")}</td></tr>
        <tr><td>Empreinte</td><td class="mono fp">${esc(id.fingerprint)}</td></tr>
        <tr><td>Ancres déclarées</td><td class="mono">${(id.profile.anchors||[]).map(esc).join(", ")||"—"}</td></tr>
      </tbody></table>
    </div></div>`;

    /* demandes reçues */
    html+=`<div class="card"><h3>Demandes reçues`+
      (inbound.length?` <span class="badge b-crit">${inbound.length}</span>`:"")+`</h3><div class="body">`;
    html+= inbound.length? inbound.map(p=>`<div class="pend">
      <div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap">
        <strong>${esc(p.org||"(sans nom)")}</strong><span class="mono">${esc(p.asn)}</span>
        ${p.contact_name?`<span style="font-size:12px;color:var(--ink2)">· ${esc(p.contact_name)}</span>`:""}
        <span style="margin-left:auto;font-size:12px;color:var(--ink2)">${dt(p.created_at)}</span>
      </div>
      <div class="mono" style="font-size:12px;color:var(--ink2);margin-top:3px">${esc(p.url)}</div>
      <div style="margin-top:8px;font-size:12px">Empreinte annoncée :
        <span class="mono fp">${esc(p.fingerprint)}</span></div>
      <div class="quote"><span class="lbl">Justification</span>${esc(p.justification)}</div>
      ${p.private_note?`<div class="quote priv"><span class="lbl">Note privée à votre attention</span>${esc(p.private_note)}</div>`:""}
      <div style="font-size:12px;color:var(--ink2)">Ancres : <span class="mono">${(p.anchors||[]).map(esc).join(", ")||"—"}</span>
        · Affichage public : ${p.public_listing?'<span class="badge b-ok">accepté par le demandeur</span>':'<span class="badge b-n">refusé par le demandeur</span>'}</div>
      <div class="field" style="margin-top:11px"><label>Réponse privée au demandeur (facultative)</label>
        <textarea rows="2" id="rep${p.id}" placeholder="Bienvenue ! Nos ancres sont joignables en v4 et v6."></textarea></div>
      <label class="chk"><input type="checkbox" id="pub${p.id}" ${p.public_listing?"checked":"disabled"}>
        <span>Afficher cet appairage sur notre page publique<small>${p.public_listing
          ?"Le demandeur l'accepte. Il ne sera affiché que si vous cochez aussi."
          :"Impossible : le demandeur ne l'a pas accepté."}</small></span></label>
      <div class="acts">
        <button class="btn p s" data-acc="${p.id}">Accepter l'appairage</button>
        <button class="btn d s" data-rej="${p.id}">Refuser</button>
      </div></div>`).join("") : `<div class="empty">Aucune demande en attente.</div>`;
    html+=`</div></div>`;

    /* nouvelle demande */
    html+=`<div class="card"><h3>Demander un appairage</h3><div class="body">
      <div class="field"><label>URL publique de l'autre instance</label>
        <input id="purl" placeholder="https://smokestack.monsite.fr/pairing"></div>
      <div class="field"><label>Justification <span style="color:var(--crit)">*</span>
        — visible par l'administrateur distant, ${MINJ} caractères minimum</label>
        <textarea id="pjust" rows="3" placeholder="Nous peerons au France-IX Paris et à LyonIX et partageons de nombreux clients entreprises : un suivi croisé de nos ancres nous aiderait à qualifier les incidents plus vite."></textarea>
        <div class="counter" id="pjc">0 / ${MINJ}</div></div>
      <div class="field"><label>Note privée pour l'administrateur distant (facultative)</label>
        <textarea id="pnote" rows="2" placeholder="Bonjour Julien, suite à notre échange au dernier FRnOG…"></textarea></div>
      <div class="row2">
        <div class="field"><label>Contact signataire</label><input id="pcontact" value="${esc(ME.display_name)}"></div>
      </div>
      <label class="chk"><input type="checkbox" id="ppub" checked>
        <span>Accepter que cet appairage soit affiché publiquement<small>Des deux côtés, l'affichage exige l'accord des deux parties.
          Vous pourrez le masquer plus tard.</small></span></label>
      <button class="btn p" id="pgo">Envoyer la demande</button>
      <div class="note" style="margin-top:12px">La justification et la note privée ne sont transmises qu'à
        l'administrateur distant. Elles n'apparaissent sur aucune page publique.</div>
    </div></div>`;

    /* demandes envoyées */
    html+=`<div class="card"><h3>Demandes envoyées</h3><div class="body">`;
    html+= outbound.length? outbound.map(p=>`<div style="padding:10px 0;border-top:1px solid var(--line2)">
      <div style="display:flex;gap:9px;align-items:baseline;flex-wrap:wrap">
        <span class="mono" style="font-weight:600">${esc(p.asn)}</span><span>${esc(p.org)}</span>
        <span class="badge ${p.state==="accepted"?"b-ok":p.state==="pending"?"b-warn":"b-crit"}">${esc(p.state)}</span>
        <span style="margin-left:auto;font-size:12px;color:var(--ink2)">${dt(p.created_at)}</span></div>
      <div class="mono" style="font-size:11.5px;color:var(--ink3);margin-top:2px">empreinte distante ${esc(p.fingerprint)}</div>
      <div class="quote"><span class="lbl">Votre justification</span>${esc(p.justification)}</div>
      ${p.reply_note?`<div class="quote priv"><span class="lbl">Réponse de ${esc(p.org)}</span>${esc(p.reply_note)}</div>`:""}
      ${p.error?`<div style="font-size:12px;color:var(--crit)">${esc(p.error)}</div>`:""}
    </div>`).join("") : `<div class="empty">Aucune demande envoyée.</div>`;
    html+=`</div></div>`;

    /* pairs */
    html+=`<div class="card"><h3>Pairs</h3><div class="body">`;
    html+= (peers&&peers.length)?`<table><thead><tr><th>AS</th><th>Organisation</th>
      <th>Empreinte</th><th>Public</th><th>Vu</th><th></th></tr></thead><tbody>`+
      peers.map(p=>`<tr><td class="mono">${esc(p.asn)}</td><td>${esc(p.org)}
        <div style="font-size:11.5px;color:var(--ink3)">${esc(p.noc_email||"")}</div></td>
        <td class="mono" style="font-size:12px">${esc(p.fingerprint)}</td>
        <td><label class="chk" style="margin:0"><input type="checkbox" data-pubtog="${p.id}"
          ${p.public?"checked":""} ${p.peer_consent?"":"disabled"}>
          <span style="font-size:12px">${p.peer_consent?(p.public?"affiché":"masqué"):"sans consentement"}</span></label></td>
        <td style="font-size:12px">${dt(p.last_seen_at)}</td>
        <td style="text-align:right"><button class="btn d s" data-pdel="${p.id}">Retirer</button></td></tr>`+
        (p.last_error?`<tr><td colspan="6" style="font-size:11px;color:var(--crit);border-top:none;padding-top:0">${esc(p.last_error)}</td></tr>`:"")
      ).join("")+`</tbody></table>`:`<div class="empty">Aucun pair.</div>`;
    html+=`</div></div>`;

    $("#f").innerHTML=html;

    const jc=()=>{const n=[...$("#pjust").value.trim()].length;
      $("#pjc").textContent=n+" / "+MINJ;$("#pjc").className="counter"+(n<MINJ?" bad":"");};
    $("#pjust").oninput=jc;jc();

    $("#pgo").onclick=async()=>{
      try{
        const r=await api("POST","/api/v1/admin/fed/pairing",{
          url:$("#purl").value,justification:$("#pjust").value,
          private_note:$("#pnote").value,contact_name:$("#pcontact").value,
          public_listing:$("#ppub").checked});
        toast("Demande envoyée — empreinte distante "+r.pairing.fingerprint);render();
      }catch(e){toast(e.message,true);}
    };
    document.querySelectorAll("[data-acc]").forEach(b=>b.onclick=async()=>{
      const id=b.dataset.acc;
      if(!confirm("Avez-vous vérifié l'empreinte hors bande ? Accepter approuve ce pair et commence à mesurer ses ancres.")) return;
      try{await api("POST","/api/v1/admin/fed/pairing/"+id+"/decide",
        {accept:true,reply:$("#rep"+id).value,public_listing:$("#pub"+id).checked});
        toast("Appairage accepté");render();}catch(e){toast(e.message,true);}
    });
    document.querySelectorAll("[data-rej]").forEach(b=>b.onclick=async()=>{
      const id=b.dataset.rej;
      try{await api("POST","/api/v1/admin/fed/pairing/"+id+"/decide",
        {accept:false,reply:$("#rep"+id).value});toast("Demande refusée");render();}
      catch(e){toast(e.message,true);}
    });
    document.querySelectorAll("[data-pubtog]").forEach(c=>c.onchange=async()=>{
      try{await api("PATCH","/api/v1/admin/fed/peers/"+c.dataset.pubtog,{public:c.checked});
        toast(c.checked?"Pair affiché publiquement":"Pair masqué");render();}
      catch(e){toast(e.message,true);render();}
    });
    document.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Retirer ce pair ? Les mesures vers ses ancres restent en base.")) return;
      try{await api("DELETE","/api/v1/admin/fed/peers/"+b.dataset.pdel);
        toast("Pair retiré");render();}catch(e){toast(e.message,true);}
    });
  }catch(e){$("#f").innerHTML=`<div class="note">${esc(e.message)}</div>`;}
}

/* ------------------------------------------------ mise à jour */
async function viewUpdate(m){
  m.innerHTML=`<h2>Mise à jour</h2>
    <p class="lead">Téléversez le ZIP d'une nouvelle version : il est vérifié (signature, plateforme,
      empreinte), testé, puis activé en un clic. L'ancienne version reste sur le disque et
      reprend la main automatiquement si la nouvelle ne démarre pas.</p><div id="u">Chargement…</div>`;
  let S;
  try{S=await api("GET","/api/v1/admin/update");}catch(e){$("#u").innerHTML=`<div class="note">${esc(e.message)}</div>`;return;}
  const staged=S.staged, av=S.available;
  let h=`<div class="card"><h3>Version installée</h3><div class="body"><table><tbody>
    <tr><td style="width:220px">Version</td><td><strong class="mono">${esc(S.version)}</strong> <span style="color:var(--ink3)">${esc(S.platform)} ${esc(S.build_date||"")}</span></td></tr>
    <tr><td>Version précédente</td><td class="mono">${esc(S.previous||"—")}</td></tr>
    <tr><td>Mises à jour en place</td><td>${S.managed?'<span class="badge b-ok">disponibles</span> <span class="mono" style="font-size:12px">'+esc(S.root)+'</span>'
      :'<span class="badge b-crit">indisponibles</span> '+esc(S.reason)}</td></tr>
    <tr><td>Clés de publication</td><td class="mono">${S.trusted_keys.length?S.trusted_keys.map(esc).join(", "):'<span style="color:var(--crit)">aucune</span>'}
      ${S.allow_unsigned?' <span class="badge b-warn">paquets non signés autorisés</span>':""}</td></tr>
    </tbody></table>
    ${S.previous&&S.managed?`<div class="acts"><button class="btn d s" id="rb">Revenir à ${esc(S.previous)}</button></div>`:""}
  </div></div>`;

  h+=`<div class="card"><h3>Installer une version</h3><div class="body">
    <div class="field"><label>Paquet ZIP (smokestack-VERSION-linux-ARCH.zip)</label>
      <input type="file" id="pkg" accept=".zip,application/zip" ${S.managed?"":"disabled"}></div>
    <button class="btn p" id="up" ${S.managed?"":"disabled"}>Vérifier le paquet</button>
    <div id="stg" style="margin-top:14px"></div></div></div>`;

  h+=`<div class="card"><h3>Mises à jour automatiques</h3><div class="body">
    <label class="chk"><input type="checkbox" id="ac" ${S.auto_check?"checked":""}><span>Vérifier régulièrement si une nouvelle version existe
      <small>Source : <span class="mono">${esc(S.manifest_url)}</span></small></span></label>
    <label class="chk"><input type="checkbox" id="aa" ${S.auto_apply?"checked":""} ${S.managed?"":"disabled"}><span>Installer automatiquement les nouvelles versions
      <small>Seuls les paquets signés par une clé de confiance sont installés automatiquement, sans exception.</small></span></label>
    <div class="acts"><button class="btn s" id="chk">Vérifier maintenant</button></div>
    <div id="avl" style="margin-top:10px;font-size:13px">${av?(av.newer?`<span class="badge b-warn">version ${esc(av.version)} disponible</span>`
      :`<span class="badge b-ok">à jour</span> dernière version publiée : ${esc(av.version)}`):""}</div>
  </div></div>`;

  h+=`<div class="card"><h3>Historique</h3><div class="body">`+(S.history.length?`<table><thead><tr><th>Date</th><th>Action</th><th>De</th><th>Vers</th><th>Par</th></tr></thead><tbody>`+
    S.history.map(x=>`<tr><td>${dt(x.ts)}</td><td>${x.action==="rollback"?"retour arrière":x.action==="auto_rollback"?'<span class="badge b-crit">restauration automatique</span>':"mise à jour"}</td><td class="mono">${esc(x.from||"—")}</td>
      <td class="mono">${esc(x.to)}</td><td>${esc(x.by)}</td></tr>`).join("")+`</tbody></table>`:`<div class="empty">Aucune mise à jour.</div>`)+`</div></div>`;
  $("#u").innerHTML=h;

  const showStaged=st=>{$("#stg").innerHTML=`<div class="pend">
    <div style="display:flex;gap:9px;align-items:baseline;flex-wrap:wrap"><strong>Version ${esc(st.version)}</strong>
      ${st.signed?`<span class="badge b-ok">signée · clé ${esc(st.key_id)}</span>`:'<span class="badge b-warn">non signée</span>'}
      ${st.newer?'<span class="badge b-ok">plus récente</span>':'<span class="badge b-warn">pas plus récente que '+esc(st.current)+'</span>'}</div>
    <div style="font-size:12px;color:var(--ink2);margin-top:4px">${esc(st.os)}-${esc(st.arch)} · construite le ${esc(st.built_at||"?")}
      · SHA-256 <span class="mono">${esc(st.sha256.slice(0,16))}…</span> · autotest réussi</div>
    ${st.notes?`<div class="quote">${esc(st.notes)}</div>`:""}
    ${st.newer?"":`<label class="chk"><input type="checkbox" id="frc"><span>Forcer l'installation d'une version antérieure ou identique</span></label>`}
    <div class="acts"><button class="btn p" id="ap">Installer et redémarrer</button></div></div>`;
    $("#ap").onclick=async()=>{
      if(!confirm("Installer la version "+st.version+" ? Le service redémarre (quelques secondes).")) return;
      try{await api("POST","/api/v1/admin/update/apply",{force:!!($("#frc")&&$("#frc").checked)});waitRestart(st.version);}
      catch(e){toast(e.message,true);}
    };
  };
  if(staged) showStaged(staged);
  if($("#up")) $("#up").onclick=async()=>{
    const f=$("#pkg").files[0]; if(!f){toast("Choisissez un fichier ZIP",true);return;}
    const fd=new FormData(); fd.append("package",f);
    $("#up").disabled=true;$("#up").textContent="Vérification…";
    try{
      const r=await fetch("/api/v1/admin/update/upload",{method:"POST",body:fd,headers:{"X-CSRF-Token":CSRF},credentials:"same-origin"});
      const d=await r.json(); if(!r.ok) throw new Error(d.error||("HTTP "+r.status));
      showStaged(d);
    }catch(e){toast(e.message,true);}
    $("#up").disabled=false;$("#up").textContent="Vérifier le paquet";
  };
  if($("#rb")) $("#rb").onclick=async()=>{
    if(!confirm("Revenir à la version "+S.previous+" ?")) return;
    try{await api("POST","/api/v1/admin/update/rollback");waitRestart(S.previous);}catch(e){toast(e.message,true);}
  };
  const save=async()=>{try{await api("PUT","/api/v1/admin/update/settings",{auto_check:$("#ac").checked,auto_apply:$("#aa").checked});toast("Préférences enregistrées");}
    catch(e){toast(e.message,true);}};
  $("#ac").onchange=save;$("#aa").onchange=save;
  $("#chk").onclick=async()=>{try{await api("POST","/api/v1/admin/update/check");render();}catch(e){toast(e.message,true);}};
}
async function waitRestart(ver){
  $("#u").innerHTML=`<div class="card"><div class="body"><strong>Redémarrage sur la version ${esc(ver)}…</strong>
    <p class="lead" style="margin-top:6px">La page se rechargera d'elle-même.</p></div></div>`;
  for(let i=0;i<60;i++){
    await new Promise(r=>setTimeout(r,1500));
    try{const v=await fetch("/api/v1/version",{cache:"no-store"}).then(r=>r.json());
      if(v.version===ver){toast("Version "+ver+" active");render();return;}}catch(e){}
  }
  toast("Le service ne répond pas encore : vérifiez journalctl -u smokestack",true);
}

        <td style="font-size:12px">${(l.warnings||[]).length?`<span class="badge b-warn">${l.warnings.length}</span>`:"—"}</td>
        <td style="text-align:right">${l.missing?`<button class="btn s" data-miss="${esc(l.code)}">${l.missing} manquantes</button>`:""}</td></tr>`).join("")+

      catch(e){toast(e.message,true);}};
    document.querySelectorAll("[data-miss]").forEach(b=>b.onclick=async()=>{
      const r=await api("GET","/api/v1/admin/i18n/"+b.dataset.miss+"/missing");
      $("#miss").innerHTML=`<div class="note" style="margin-top:12px"><strong>${esc(r.code)}</strong> — clés à traduire :
        <div class="mono" style="font-size:12px;margin-top:6px">${r.missing.map(esc).join("<br>")}</div></div>`;

}

/* ------------------------------------------------ alerting */
async function viewNotify(m){
  m.innerHTML=`<h2>Alerting NOC</h2>
    <p class="lead">Une notification ne part que si quatre conditions sont réunies :
      au moins trois observateurs indépendants ont corroboré, le préavis de cinq minutes
      est écoulé, l'AS mis en cause n'a pas acquitté, et c'est un pair approuvé — donc
      un opérateur qui a consenti en rejoignant. Aucun courriel non sollicité.</p>
    <div id="n">Chargement…</div>`;
  try{
    const id=await api("GET","/api/v1/admin/fed/identity");
    const c=id.notify||{};
    $("#n").innerHTML=`<div class="card"><h3>Transport</h3><div class="body">
      <div class="field"><label>
        <input type="checkbox" id="en" ${c.enabled?"checked":""} style="width:auto;margin-right:7px">
        Notifications activées</label></div>
      <div class="row2">
        <div class="field"><label>Serveur SMTP</label><input id="sh" value="${esc(c.smtp_host||"")}"></div>
        <div class="field"><label>Port</label><input id="sp" type="number" value="${c.smtp_port||587}"></div>
        <div class="field"><label>Utilisateur</label><input id="su" value="${esc(c.smtp_user||"")}"></div>
        <div class="field"><label>Mot de passe</label><input id="sw" type="password" placeholder="inchangé"></div>
        <div class="field"><label>Expéditeur</label><input id="sf" value="${esc(c.from||"")}"></div>
        <div class="field"><label>Webhook (facultatif)</label><input id="wh" value="${esc(c.webhook_url||"")}"></div>
      </div>
      <button class="btn p" id="save">Enregistrer</button>
    </div></div>
    <div class="card"><h3>Incidents fédérés</h3><div class="body" id="inc">Chargement…</div></div>`;
    $("#save").onclick=async()=>{
      try{
        await api("PUT","/api/v1/admin/fed/notify",{
          enabled:$("#en").checked,smtp_host:$("#sh").value,
          smtp_port:parseInt($("#sp").value,10),smtp_user:$("#su").value,
          smtp_pass:$("#sw").value,from:$("#sf").value,webhook_url:$("#wh").value});
        toast("Enregistré");render();
      }catch(e){toast(e.message,true);}
    };
    const incs=await api("GET","/api/v1/fed/incidents").catch(()=>[]);
    $("#inc").innerHTML=(incs&&incs.length)?`<table><thead><tr><th>AS visé</th>
      <th>Cible</th><th>Constat</th><th>Corrob.</th><th>État</th><th>Ouvert</th>
      </tr></thead><tbody>`+incs.map(i=>`<tr><td class="mono">${esc(i.suspect_asn)}</td>
      <td class="mono">${esc(i.target)}</td><td style="font-size:12px">${esc(i.detail)}</td>
      <td>${i.corroborated}</td>
      <td><span class="badge ${i.ack_at?"b-ok":i.notified_at?"b-crit":"b-warn"}">
        ${i.ack_at?"acquitté":i.notified_at?"NOC notifié":"préavis"}</span></td>
      <td style="font-size:12px">${dt(i.opened_at)}</td></tr>`).join("")+`</tbody></table>`
      :`<div class="empty">Aucun incident.</div>`;
  }catch(e){$("#n").innerHTML=`<div class="note">${esc(e.message)}</div>`;}
}

/* ------------------------------------------------- stockage */
async function viewStorage(m){
  m.innerHTML=`<h2>Stockage</h2>
    <p class="lead">Les agrégats horaires et journaliers ne sont jamais évincés.
      Seule l'archive brute est soumise à rotation, et les chunks déjà présents sur S3
      partent en premier puisqu'ils restent récupérables.</p>
    <div id="s">Chargement…</div>`;
  try{
    const d=await api("GET","/api/v1/admin/storage");
    const c=d.config,r=d.report||{},s3=c.s3||{},lo=c.local||{};
    $("#s").innerHTML=`<div class="card"><h3>Mode</h3><div class="body">
      <div class="field"><label>Politique</label><select id="mode">
        <option value="local" ${c.mode==="local"?"selected":""}>Local uniquement (rotation par capacité)</option>
        <option value="s3" ${c.mode==="s3"?"selected":""}>S3 en priorité</option>
        <option value="hybrid" ${c.mode==="hybrid"?"selected":""}>Hybride (local puis S3)</option>
      </select></div></div></div>
      <div class="card"><h3>Cible S3</h3><div class="body"><div class="row2">
        <div class="field"><label>Endpoint</label><input id="ep" value="${esc(s3.endpoint||"")}" placeholder="s3.fr-par.scw.cloud"></div>
        <div class="field"><label>Bucket</label><input id="bk" value="${esc(s3.bucket||"")}"></div>
        <div class="field"><label>Préfixe</label><input id="px" value="${esc(s3.prefix||"")}"></div>
        <div class="field"><label>Région</label><input id="rg" value="${esc(s3.region||"")}"></div>
        <div class="field"><label>Clé d'accès</label><input id="ak" value="${esc(s3.access_key||"")}"></div>
        <div class="field"><label>Clé secrète</label><input id="sk" type="password" placeholder="inchangée"></div>
        <div class="field"><label>Classe de stockage</label><input id="cl" value="${esc(s3.storage_class||"")}"></div>
        <div class="field"><label><input type="checkbox" id="ps" ${s3.path_style?"checked":""}
          style="width:auto;margin-right:7px">Path-style (MinIO, Ceph)</label></div>
      </div></div></div>
      <div class="card"><h3>Rotation locale</h3><div class="body"><div class="row2">
        <div class="field"><label>Quota (Go)</label><input id="q" type="number" step="0.5"
          value="${((lo.quota_bytes||0)/1073741824).toFixed(1)}"></div>
        <div class="field"><label>Seuil haut</label><input id="hw" type="number" step="0.01"
          value="${lo.high_watermark||0.85}"></div>
        <div class="field"><label>Seuil bas</label><input id="lw" type="number" step="0.01"
          value="${lo.low_watermark||0.7}"></div>
        <div class="field"><label>Conservation locale (h)</label><input id="kl" type="number"
          value="${lo.keep_local_hours||48}"></div>
      </div>
      <button class="btn p" id="save">Enregistrer</button></div></div>
      <div class="card"><h3>État</h3><div class="body"><table><tbody>
        <tr><td style="width:210px">Archive locale</td><td>${gb(r.local_bytes||0)} / ${gb(r.quota_bytes||0)}</td></tr>
        <tr><td>Occupation du disque</td><td>${((r.disk_used_pct||0)*100).toFixed(1)} %
          ${r.degraded?'<span class="badge b-crit">mode dégradé</span>':""}</td></tr>
        <tr><td>Chunks</td><td>${r.chunks||0}</td></tr>
        <tr><td>Uploads en attente</td><td>${r.pending_uploads||0}</td></tr>
        <tr><td>Rétention projetée</td><td>${r.projected_days?r.projected_days.toFixed(0)+" jours":"—"}</td></tr>
      </tbody></table></div></div>`;
    $("#save").onclick=async()=>{
      try{
        await api("PUT","/api/v1/admin/storage",{
          mode:$("#mode").value,
          s3:{endpoint:$("#ep").value,bucket:$("#bk").value,prefix:$("#px").value,
              region:$("#rg").value,access_key:$("#ak").value,secret_key:$("#sk").value,
              path_style:$("#ps").checked,storage_class:$("#cl").value},
          local:{quota_bytes:Math.round(parseFloat($("#q").value||0)*1073741824),
                 high_watermark:parseFloat($("#hw").value),
                 low_watermark:parseFloat($("#lw").value),
                 keep_local_hours:parseInt($("#kl").value,10)}});
        toast("Enregistré");render();
      }catch(e){toast(e.message,true);}
    };
  }catch(e){$("#s").innerHTML=`<div class="note">${esc(e.message)}</div>`;}
}

/* -------------------------------------------- page éditeur */
async function viewSite(m){
  m.innerHTML=`<h2>Page éditeur</h2>
    <p class="lead">Ces informations alimentent la page publique /about.html.
      Le téléphone du NOC n'y apparaît jamais : il n'est renvoyé qu'aux appels authentifiés.</p>
    <div id="s">Chargement…</div>`;
  try{
    const s=await api("GET","/api/v1/site");
    LANGS=(await api("GET","/api/v1/i18n").catch(()=>({languages:[]}))).languages;
    const f=(id,lab,val,ph)=>`<div class="field"><label>${lab}</label>
      <input id="${id}" value="${esc(val||"")}" placeholder="${esc(ph||"")}"></div>`;
    $("#s").innerHTML=`<div class="card"><h3>Identité</h3><div class="body"><div class="row2">
      ${f("title","Titre de l'instance",s.title)}
      ${f("org","Organisation",s.org)}
      ${f("asn","Numéro d'AS",s.asn,"AS64500")}
      ${f("owner","Responsable",s.owner)}
      ${f("location","Localisation",s.location,"Paris, FR")}
      ${f("timezone","Fuseau horaire",s.timezone,"Europe/Paris")}
      <div class="field"><label>Langue par défaut des pages publiques</label>
        <select id="default_lang">${(LANGS||[]).map(l=>`<option value="${esc(l.code)}" ${l.code===(s.default_lang||"en")?"selected":""}>${esc(l.name)}</option>`).join("")}</select></div>
    </div></div></div>
    <div class="card"><h3>Contacts</h3><div class="body"><div class="row2">
      ${f("email","Courriel général",s.email)}
      ${f("noc_email","Courriel du NOC",s.noc_email)}
      ${f("noc_phone","Téléphone du NOC",s.noc_phone)}
      ${f("url","Site web",s.url)}
      ${f("peeringdb","Fiche PeeringDB",s.peeringdb)}
    </div></div></div>
    <div class="card"><h3>Textes</h3><div class="body">
      <div class="field"><label>Description</label><textarea id="description" rows="3">${esc(s.description||"")}</textarea></div>
      <div class="field"><label>Mentions</label><textarea id="legal" rows="2">${esc(s.legal||"")}</textarea></div>
      <button class="btn p" id="save">Enregistrer</button>
    </div></div>`;
    $("#save").onclick=async()=>{
      const ids=["title","org","asn","owner","location","timezone","email",
                 "noc_email","noc_phone","url","peeringdb","description","legal","default_lang"];
      const body={};ids.forEach(k=>body[k]=$("#"+k).value);
      try{await api("PUT","/api/v1/admin/site",body);toast("Enregistré");}
      catch(e){toast(e.message,true);}
    };
  }catch(e){$("#s").innerHTML=`<div class="note">${esc(e.message)}</div>`;}
}

/* ---------------------------------------------- utilisateurs */
async function viewUsers(m){
  m.innerHTML=`<h2>Utilisateurs</h2>
    <p class="lead"><strong>master</strong> gère les comptes et tout le reste.
      <strong>admin</strong> gère la configuration, la fédération et le stockage, mais pas les comptes.
      <strong>editor</strong> ne touche qu'aux cibles et catégories. <strong>viewer</strong> lit seulement.
      Il doit toujours rester au moins un master actif.</p>
    <div class="card"><h3>Nouveau compte</h3><div class="body"><div class="row2">
      <div class="field"><label>Courriel</label><input id="ue" type="email"></div>
      <div class="field"><label>Nom affiché</label><input id="un"></div>
      <div class="field"><label>Mot de passe</label><input id="up" type="password"></div>
      <div class="field"><label>Rôle</label><select id="ur">
        <option value="viewer">viewer</option><option value="editor">editor</option>
        <option value="admin">admin</option><option value="master">master</option></select></div>
    </div><button class="btn p" id="add">Créer le compte</button></div></div>
    <div class="card"><h3>Comptes</h3><div class="body" id="l">Chargement…</div></div>`;
  $("#add").onclick=async()=>{
    try{
      await api("POST","/api/v1/admin/users",{email:$("#ue").value,name:$("#un").value,
        password:$("#up").value,role:$("#ur").value});
      toast("Compte créé");render();
    }catch(e){toast(e.message,true);}
  };
  try{
    const list=await api("GET","/api/v1/admin/users");
    $("#l").innerHTML=`<table><thead><tr><th>Courriel</th><th>Nom</th><th>Rôle</th>
      <th>Dernière connexion</th><th></th></tr></thead><tbody>`+
      list.map(u=>`<tr class="${u.disabled?"dis":""}">
        <td>${esc(u.email)}${u.id===ME.id?' <span class="badge b-n">vous</span>':""}</td>
        <td>${esc(u.display_name)}</td>
        <td><select data-role="${u.id}" style="width:auto;padding:3px 7px">`+
          ["viewer","editor","admin","master"].map(r=>
          `<option ${u.role===r?"selected":""}>${r}</option>`).join("")+`</select></td>
        <td style="font-size:12px">${dt(u.last_login_at)}</td>
        <td style="text-align:right">
          <button class="btn s" data-dis="${u.id}" data-on="${u.disabled?0:1}">
            ${u.disabled?"Réactiver":"Désactiver"}</button>
          <button class="btn s" data-rst="${u.id}">Mot de passe</button>
          ${u.id!==ME.id?`<button class="btn d s" data-udel="${u.id}">Supprimer</button>`:""}
        </td></tr>`).join("")+`</tbody></table>`;
    document.querySelectorAll("[data-role]").forEach(s=>s.onchange=async()=>{
      try{await api("PATCH","/api/v1/admin/users/"+s.dataset.role,{role:s.value});
        toast("Rôle modifié");render();}catch(e){toast(e.message,true);render();}
    });
    document.querySelectorAll("[data-dis]").forEach(b=>b.onclick=async()=>{
      try{await api("PATCH","/api/v1/admin/users/"+b.dataset.dis,
        {disabled:b.dataset.on==="1"});toast("Compte mis à jour");render();}
      catch(e){toast(e.message,true);}
    });
    document.querySelectorAll("[data-rst]").forEach(b=>b.onclick=async()=>{
      const pw=prompt("Nouveau mot de passe (12 caractères minimum)");if(!pw) return;
      try{await api("PATCH","/api/v1/admin/users/"+b.dataset.rst,{password:pw});
        toast("Mot de passe réinitialisé, sessions fermées");}catch(e){toast(e.message,true);}
    });
    document.querySelectorAll("[data-udel]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Supprimer ce compte ?")) return;
      try{await api("DELETE","/api/v1/admin/users/"+b.dataset.udel);
        toast("Compte supprimé");render();}catch(e){toast(e.message,true);}
    });
  }catch(e){$("#l").innerHTML=`<div class="note">${esc(e.message)}</div>`;}
}

/* ---------------------------------------------------- journal */
async function viewAudit(m){
  m.innerHTML=`<h2>Journal</h2>
    <p class="lead">Deux cents dernières actions d'administration, connexions et échecs de
      connexion compris.</p>
    <div class="card"><div class="body" id="l">Chargement…</div></div>`;
  try{
    const list=await api("GET","/api/v1/admin/audit");
    $("#l").innerHTML=(list&&list.length)?`<table><thead><tr><th>Date</th><th>Compte</th>
      <th>Action</th><th>Objet</th><th>IP</th></tr></thead><tbody>`+
      list.map(e=>`<tr><td style="font-size:12px">${dt(e.ts)}</td>
        <td style="font-size:12px">${esc(e.email||"—")}</td>
        <td><span class="badge ${e.action==="login_failed"?"b-crit":"b-n"}">${esc(e.action)}</span></td>
        <td style="font-size:12px">${esc(e.entity)} ${esc(e.entity_id)}</td>
        <td class="mono" style="font-size:12px">${esc(e.ip)}</td></tr>`).join("")+
      `</tbody></table>`:`<div class="empty">Journal vide.</div>`;
  }catch(e){$("#l").innerHTML=`<div class="note">${esc(e.message)}</div>`;}
}

/* -------------------------------------------------- démarrage */
(async()=>{
  try{
    const st=await api("GET","/api/v1/auth/state");
    if(st.setup_required) return gateSetup();
    if(st.user){CSRF=st.csrf;ME=st.user;
      try{const p=await api("GET","/api/v1/admin/fed/pairing");
        PENDING=(p||[]).filter(x=>x.direction==="in"&&x.state==="pending").length;}catch(e){}
      return shell();}
    gateLogin();
  }catch(e){
    $("#app").innerHTML=`<div class="gate"><div class="gatebox">
      <h1>Instance injoignable</h1><p class="sub">${esc(e.message)}</p></div></div>`;
  }
})();
</script>
</body>
</html>
